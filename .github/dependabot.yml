version: 2

updates:
  # NPM dependencies (pnpm monorepo - root lockfile covers all workspaces)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Disable scheduled version updates to prioritize security alerts.
    # Security updates (triggered by alerts) ignore this limit and will still be created.
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # One PR per run for all security fixes, instead of one PR per alert.
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      dev-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "prettier*"
          - "typescript"
          - "@typescript-eslint/*"
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
          - "@aws-cdk/*"
          - "aws-cdk-lib"
      mui:
        patterns:
          - "@mui/*"
      next-js:
        patterns:
          - "next"
          - "@next/*"
      sst:
        patterns:
          - "sst"
          - "constructs"
      ai-llm:
        patterns:
          - "@anthropic-ai/*"
          - "@google/*"
          - "openai"
          - "@langchain/*"
          - "langchain"
      tanstack:
        patterns:
          - "@tanstack/*"
      mongoose:
        patterns:
          - "mongoose"
          - "@typegoose/*"

  # Public docs site: its own lockfile outside the pnpm workspace, deployed to production on merge.
  - package-ecosystem: "npm"
    directory: "/docs-site"
    schedule:
      interval: "weekly"
      day: "monday"
    # Security updates only, same as the root entry.
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # The deployer requires one sst version across the app, overlays and docs site; bump it everywhere at once.
      - dependency-name: "sst"

  # GitHub Actions - monthly to keep CI pipeline secure with minimal noise
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Disable scheduled version updates to prioritize security alerts.
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # Private org repo - Dependabot can't access it without extra PAT config
      # We manage workflow-templates internally, no need for automated updates
      - dependency-name: "MillionOnMars/workflow-templates"
