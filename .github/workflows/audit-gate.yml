name: Dependency Audit Gate

# pnpm audit checks (logic in scripts/audit-gate.mjs, fix steps in
# CONTRIBUTING.md#fixing-a-dependency-advisory).
# - PRs and merge queue (audit-gate): diff-based. Audits both the base commit and
#   the head, and fails only on high/critical GHSAs the change introduces that are
#   not in scripts/audit-allowlist.json. Advisories already on base are warnings,
#   so a new advisory against an existing dependency doesn't turn every PR red.
# - Schedule and manual runs on main (audit-main): full mode. Opens or updates
#   one tracking issue on new findings, opens or updates one auto-fix PR
#   (scripts/audit-autofix.mjs) for a human to merge, and closes both once main
#   is clean.
# The existing packages-audit.yml sends a full report to the Security Dashboard
# and remains workflow_dispatch-only; this workflow is independent of it.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

env:
  NODE_VERSION: '24'

concurrency:
  group: audit-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit-gate:
    name: Dependency Audit Gate
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest-m' }}
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        timeout-minutes: 5
        run: bash scripts/audit-report.sh . "$GITHUB_WORKSPACE/audit-report.json"

      # Audit the base commit's manifest, lockfile and workspace file only (pnpm
      # audit needs no install). Uses the event's base sha, not HEAD^1, which is
      # wrong for merge-queue groups.
      - name: Run pnpm audit on base
        timeout-minutes: 5
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          for i in 1 2 3; do
            git fetch --no-tags --depth=1 origin "$BASE_SHA" && break
            if [ "$i" = 3 ]; then
              echo "::error::could not fetch base commit $BASE_SHA for the base audit report (infrastructure, re-run the job)"
              exit 1
            fi
            sleep 10
          done
          mkdir -p "$RUNNER_TEMP/audit-base"
          git archive "$BASE_SHA" package.json pnpm-lock.yaml pnpm-workspace.yaml | tar -x -C "$RUNNER_TEMP/audit-base"
          bash scripts/audit-report.sh "$RUNNER_TEMP/audit-base" "$RUNNER_TEMP/audit-base.json"

      - name: Run audit regression gate
        env:
          PACKAGES_JSON_REPORT_PATH: ${{ github.workspace }}/audit-report.json
          BASE_JSON_REPORT_PATH: ${{ runner.temp }}/audit-base.json
        run: node scripts/audit-gate.mjs

      - name: Run audit gate tests
        run: pnpm exec vitest run --dir scripts/__tests__ --reporter=verbose audit-

  audit-main:
    name: Dependency Audit (main)
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.repository == (vars.CANONICAL_REPO || 'MillionOnMars/lumina5')
    # Standard runner: the repo is public, so it's free, and this job is small.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GITHUB_TOKEN only manages the issue and closes a stale auto-fix PR; the
    # auto-fix branch and PR use the App token so CI runs on the PR.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      AUTOFIX_BRANCH: ci/dependency-audit-autofix
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # The auto-fix push authenticates with the App token, not GITHUB_TOKEN.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # No install: pnpm audit reads only the manifest and lockfile. If this
      # fails, the run is red and the tracking issue is left untouched, so an
      # infrastructure failure is never read as "advisories found" or "clean".
      - name: Run pnpm audit
        id: audit
        timeout-minutes: 5
        run: bash scripts/audit-report.sh . audit-report.json

      - name: Run audit gate (full mode)
        id: gate
        continue-on-error: true
        env:
          PACKAGES_JSON_REPORT_PATH: audit-report.json
        run: |
          set -o pipefail
          node scripts/audit-gate.mjs 2>&1 | tee gate-output.txt

      # Auto-fix steps are continue-on-error so a registry, App token or API
      # failure still leaves the tracking issue and Slack ping below.
      - name: Raise overrides past the failing advisories
        id: autofix
        if: steps.gate.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 5
        env:
          PACKAGES_JSON_REPORT_PATH: audit-report.json
          AUTOFIX_SUMMARY_PATH: ${{ runner.temp }}/autofix-summary.md
        run: node scripts/audit-autofix.mjs

      - name: Update lockfile and re-check
        id: recheck
        if: steps.autofix.outputs.changed == 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGES_JSON_REPORT_PATH: ${{ runner.temp }}/audit-report-fixed.json
          AUTOFIX_SUMMARY_PATH: ${{ runner.temp }}/autofix-summary.md
        run: |
          if [ -n "$NPM_TOKEN" ]; then echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc; fi
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile --lockfile-only
          bash scripts/audit-report.sh . "$PACKAGES_JSON_REPORT_PATH"
          if node scripts/audit-gate.mjs > "$RUNNER_TEMP/gate-fixed.txt" 2>&1; then
            echo "fixed=true" >> "$GITHUB_OUTPUT"
          else
            echo "fixed=false" >> "$GITHUB_OUTPUT"
            {
              echo
              echo 'Still failing after this change (needs a human):'
              echo
              echo '```'
              cat "$RUNNER_TEMP/gate-fixed.txt"
              echo '```'
            } >> "$AUTOFIX_SUMMARY_PATH"
          fi

      - name: Generate App token
        id: app-token
        if: steps.recheck.outcome == 'success'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Rebuilt from the current main on every failing run, so the bot branch
      # never conflicts. A push happens only when the fix content changed.
      - name: Push auto-fix branch and open or update PR
        id: autofix-pr
        if: steps.recheck.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AUTOFIX_SUMMARY_PATH: ${{ runner.temp }}/autofix-summary.md
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "::error::App token generation returned empty - check RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY. Not falling back to GITHUB_TOKEN (its PRs skip CI)."
            exit 1
          fi
          git config user.name "b4m-release-bot[bot]"
          git config user.email "b4m-release-bot[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git switch -c "$AUTOFIX_BRANCH"
          git add package.json pnpm-lock.yaml
          git commit -m "fix(deps): raise overrides past new high/critical advisories"
          if git fetch --no-tags --depth=1 origin "$AUTOFIX_BRANCH" && git diff --quiet FETCH_HEAD HEAD -- package.json pnpm-lock.yaml; then
            echo "The auto-fix branch already carries this change; not pushing."
          else
            git push --force origin "HEAD:refs/heads/$AUTOFIX_BRANCH"
          fi
          PR_URL=$(gh pr list --head "$AUTOFIX_BRANCH" --state open --json url -q '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create --base main --head "$AUTOFIX_BRANCH" \
              --title 'fix(deps): raise overrides past new high/critical advisories' \
              --body-file "$AUTOFIX_SUMMARY_PATH" --label dependencies --label security)
          else
            gh pr edit "$PR_URL" --body-file "$AUTOFIX_SUMMARY_PATH"
          fi
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Open, update or close tracking issue
        id: issue
        if: always() && steps.audit.outcome == 'success'
        uses: actions/github-script@v8
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          AUTOFIX_OUTCOME: ${{ steps.autofix.outcome }}
          AUTOFIX_CHANGED: ${{ steps.autofix.outputs.changed }}
          AUTOFIX_FIXED: ${{ steps.recheck.outputs.fixed }}
          AUTOFIX_PR_URL: ${{ steps.autofix-pr.outputs.url }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;
            const playbookUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/blob/main/CONTRIBUTING.md#fixing-a-dependency-advisory`;
            const marker = '<!-- dependency-audit-main -->';
            const failed = process.env.GATE_OUTCOME === 'failure';
            const output = fs.existsSync('gate-output.txt') ? fs.readFileSync('gate-output.txt', 'utf8').trim() : '';

            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'security',
              per_page: 100,
            });
            const found = existing.data.find(i => i.body && i.body.includes(marker));

            let autofix;
            if (process.env.AUTOFIX_PR_URL) {
              autofix = `**Auto-fix PR:** ${process.env.AUTOFIX_PR_URL}`;
              if (process.env.AUTOFIX_FIXED !== 'true') autofix += ' (does not fix everything; see its description)';
            } else if (process.env.AUTOFIX_OUTCOME === 'success' && process.env.AUTOFIX_CHANGED === 'false') {
              autofix = '**Auto-fix:** nothing could be fixed automatically; see the run log.';
            } else {
              autofix = '**Auto-fix:** the auto-fix PR could not be created; see the run log.';
            }

            if (failed) {
              const findings = ['```', output, '```'].join('\n');
              if (found) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: found.number,
                  body: [`Still failing as of ${runUrl}`, '', findings, '', autofix].join('\n'),
                });
              } else {
                const created = await github.rest.issues.create({
                  owner,
                  repo,
                  title: 'Dependency audit: high/critical advisories on main',
                  labels: ['security', 'dependencies'],
                  body: [
                    marker,
                    '',
                    'The scheduled dependency audit found high/critical advisories on `main` that are not in `scripts/audit-allowlist.json`.',
                    '',
                    findings,
                    '',
                    autofix,
                    `**Run:** ${runUrl}`,
                    `**Fix steps:** ${playbookUrl}`,
                    '',
                    '_This issue is updated by `.github/workflows/audit-gate.yml` and closed automatically once main is clean._',
                  ].join('\n'),
                });
                core.setOutput('created', 'true');
                core.setOutput('url', created.data.html_url);
              }
            } else if (found) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: found.number,
                body: `Clean as of ${runUrl}`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: found.number, state: 'closed' });
            }

            if (!failed) {
              const prs = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:${process.env.AUTOFIX_BRANCH}`,
              });
              for (const pr of prs.data) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body: `main is clean as of ${runUrl}; closing.`,
                });
                await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: 'closed' });
              }
            }

      - name: Notify Slack on new tracking issue
        if: always() && steps.issue.outputs.created == 'true' && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rotating_light: New high/critical dependency advisories on main. <${{ steps.issue.outputs.url }}|Tracking issue> | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>${{ steps.autofix-pr.outputs.url && format(' | <{0}|Auto-fix PR>', steps.autofix-pr.outputs.url) || '' }}"
            }

      - name: Fail the run when advisories were found
        if: steps.gate.outcome == 'failure'
        run: exit 1
