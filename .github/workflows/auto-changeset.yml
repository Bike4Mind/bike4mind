name: Auto Changeset

# Auto-generate .changeset/pr-{N}.md from conventional commit PR titles.
# Replaces the manual `pnpm changeset` step that developers used to forget.
# Packages are auto-discovered from workspace package.json files — no hardcoded list.
#
# The PR title supplies the bump level; the diff supplies the package set. Those two
# roles must not blur: a title scope alone can name any published package, and
# bumping on that basis publishes releases for packages the PR never touched.
#
# The generator lives in .github/scripts/generate-changeset.sh. The required `validate`
# check (semantic-pr-title.yml) re-runs it against the PR head via verify-changeset.sh and
# fails if it would commit anything, so a failed or skipped run here blocks merge.

on:
  pull_request:
    types: [opened, synchronize, edited]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changeset-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  auto-changeset:
    # Skip: forks, dependabot, Version Packages PR, non-repo
    if: >-
      github.repository == (vars.CANONICAL_REPO || 'MillionOnMars/lumina5') &&
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'changeset-release/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest-m' }}
    steps:
      - name: Skip body-only edits
        if: github.event.action == 'edited' && !github.event.changes.title
        run: echo "SKIP=true" >> "$GITHUB_ENV"

      - name: Generate App token
        if: env.SKIP != 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout PR branch
        if: env.SKIP != 'true'
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fetch base branch
        if: env.SKIP != 'true'
        run: git fetch origin main

      - name: Configure Git
        if: env.SKIP != 'true'
        run: |
          git config user.name "b4m-release-bot[bot]"
          git config user.email "b4m-release-bot[bot]@users.noreply.github.com"

      - name: Skip if last commit is from bot
        if: env.SKIP != 'true' && github.event.action == 'synchronize'
        # Only the bot's own push needs skipping (it would loop). A title edit on a
        # bot-authored head must still regenerate, or the old bump level ships.
        run: |
          LAST_AUTHOR=$(git log -1 --format='%an')
          if [ "$LAST_AUTHOR" = "b4m-release-bot[bot]" ]; then
            echo "::notice::Last commit is from bot. Skipping to prevent loop."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Generate changeset
        if: env.SKIP != 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash .github/scripts/generate-changeset.sh

      # Failure/clear comments use the workflow token, not the App token, so the
      # report still posts when generating the App token is what failed. Best effort.
      - name: Report failure on the PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          MARKER="<!-- auto-changeset-failed -->"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          BODY="${MARKER}
          **Auto-Changeset failed** ([run]($RUN_URL)), so no changeset was written for this PR. The required \`validate\` check blocks merge until the PR head carries the changeset this workflow would generate.

          To fix, any one of:
          - Re-run the failed run (open the run link, then **Re-run failed jobs**), or push a new commit.
          - If you just changed the PR title, save it again to re-trigger this workflow.
          - Run \`pnpm changeset\` to add a manual changeset at or above this PR's bump level.
          - Delete \`.changeset/pr-${PR_NUMBER}.md\` in your own commit to opt out of a release deliberately."
          ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" 2>/dev/null | head -1 || true)
          if [ -n "$ID" ]; then
            gh api "repos/$REPO/issues/comments/$ID" -X PATCH -f body="$BODY" > /dev/null || true
          else
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$BODY" > /dev/null || true
          fi

      - name: Clear failure comment
        if: success() && env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- auto-changeset-failed -->")) | .id' 2>/dev/null | head -1 || true)
          if [ -n "$ID" ]; then
            gh api "repos/$REPO/issues/comments/$ID" -X DELETE > /dev/null || true
          fi
