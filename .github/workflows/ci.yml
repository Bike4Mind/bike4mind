name: CI

# App CI: build, typecheck, lint, unit tests, and the CLI e2e harness. The merge
# gate for this repo. Deploys no longer run here: staging + production are handled
# by the internal deployer (deploy.bike4mind.com), and PR previews are created on
# demand by maintainers there. See the `ci-complete` job for the single required
# "CI Complete" aggregate check.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # NOTE: no workflow-level paths-ignore. The `changes` gate below evaluates
    # the per-PR (merge-base) diff and skips the build/test legs on non-deployable
    # changes, while still reporting the required CI Complete/Run Tests checks (a
    # paths-ignore-skipped workflow never reports them and hangs the PR).
  merge_group:
    branches: [main]

env:
  NODE_VERSION: '24'

# Cancel superseded runs for the same PR so outdated commits stop holding scarce
# ubuntu-latest-m runner slots — the dominant CI-queue bottleneck under heavy PR
# concurrency (jobs were waiting ~15 min for a runner while executing in ~3 min).
# PR-only: pushes to main and merge_group runs are NEVER cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Changes gate: evaluate the changeset that fired this run (whole-PR
  # merge-base diff on pull_request, push range on push) and emit three
  # orthogonal signals: `deployable` (run the build/test legs), `published-changed`
  # (gates `published-dts` below) and `docs-changed`
  # (gates `help-docs` and `verify-docs-build` below, so the help guards and
  # the Docusaurus build still run on a docs-only change).
  # Cheap, always runs, so the required checks always have a status to
  # report. Logic + the default exclude list live in the local composite
  # action. Fails open on all three.
  changes:
    # Root of the whole DAG.
    runs-on: ${{ github.event_name == 'merge_group' && vars.RUNNER_LABEL_QUEUE || vars.RUNNER_LABEL || 'ubuntu-latest-m' }}
    permissions:
      contents: read
    outputs:
      deployable: ${{ steps.filter.outputs.deployable }}
      docs-changed: ${{ steps.filter.outputs.docs-changed }}
      published-changed: ${{ steps.filter.outputs.published-changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect deployable / docs / published changes
        id: filter
        uses: ./.github/actions/changes-filter

  # Build the core packages once and publish their dist/ as an artifact. The
  # three gating jobs below (typecheck, lint, test) each restore this artifact
  # instead of rebuilding, then run in parallel — cutting wall clock from the
  # old sequential ~14 min (typecheck + lint + test in one runner) to ~max of
  # the three legs (~10 min). The repo-boundary checks run beside it in
  # `repo-guards`, not before the build, so they stay off the path every test leg waits on.
  core-build:
    needs: changes
    if: needs.changes.outputs.deployable == 'true'
    runs-on: ${{ github.event_name == 'merge_group' && vars.RUNNER_LABEL_MEDIUM_QUEUE || vars.RUNNER_LABEL_MEDIUM || 'ubuntu-latest-m' }}
    name: Core Build
    timeout-minutes: 15
    permissions:
      contents: read

    outputs:
      core-content-hash: ${{ steps.core-hash.outputs.content_hash }}

    steps:
      # Shallow: the content hash reads only HEAD's tree. History is for repo-guards' ASCII checks.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate core packages content hash
        id: core-hash
        run: |
          TREE_HASH_B4M=$(git ls-tree -r HEAD b4m-core packages/database packages/sdk | awk '{print $3}' | sort | md5sum | awk '{print $1}')
          CONFIG_HASH=$(git ls-tree HEAD package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.json 2>/dev/null | awk '{print $3}' | sort | md5sum | awk '{print $1}')
          CONTENT_HASH=$(echo "${TREE_HASH_B4M}${CONFIG_HASH}" | md5sum | awk '{print $1}')
          echo "content_hash=$CONTENT_HASH" >> $GITHUB_OUTPUT
          echo "Core packages content hash: $CONTENT_HASH"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pnpm-store
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --recursive

      - name: Build bike4mind core packages
        run: pnpm core:build

      - name: Upload core build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: core-build-${{ steps.core-hash.outputs.content_hash }}
          path: |
            b4m-core/*/dist
            packages/database/dist
            packages/sdk/dist
          # Intra-run handoff only: the jobs that consume this all `needs:
          # core-build`, so it is dead weight the moment the run ends. It was on
          # 7 days, which at ~1.8 GiB/day of CI artifacts overran the org's 2 GB
          # Actions+Packages storage pool on 2026-07-25 and blocked EVERY deploy
          # (staging, previews and production promotion) with "Failed to
          # CreateArtifact: Artifact storage quota has been hit" for four days.
          # Storage is billed regardless of repo visibility - public repos get
          # free minutes, not free storage. Same content hash re-uploads once per
          # run anyway, so this is not a cross-run cache and 1 day costs nothing.
          retention-days: 1
          if-no-files-found: error

  # Repo-boundary and hygiene checks that need only the checked-out source (plus the runner's own
  # bash, python3 and node). They ran inside core-build ahead of the build until it became clear
  # they put ~40s (mostly the account-ID scan) in front of every test leg; here they run in
  # parallel and still gate merges through `CI Complete`.
  repo-guards:
    needs: changes
    if: needs.changes.outputs.deployable == 'true'
    runs-on: ${{ github.event_name == 'merge_group' && vars.RUNNER_LABEL_QUEUE || vars.RUNNER_LABEL || 'ubuntu-latest-m' }}
    name: Repo Guards
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for API files missing baseApi()
        run: bash scripts/check-no-baseapi.sh

      - name: Check v1 endpoints use the contract abstraction, non-v1 handlers are jwtOnly, and Function URL handlers are contract-routed
        run: bash scripts/check-contract-gate.sh

      - name: Check user $lookup field projections
        run: node scripts/check-user-lookup-projection.mjs

      - name: Check tracked files against the overlay-literal allowlist
        run: bash scripts/check-no-overlay-literals.sh

      # Resolve what "added" means for the two ASCII checks below.
      #
      # `pull_request.base.sha` is the base-branch head recorded when the PR was opened -
      # NOT the fork point, and it does not move as the base branch advances. Both checks
      # scan ADDED lines relative to that base, so on a long-lived PR every commit main
      # gained in the meantime is attributed to the PR. That is not hypothetical: a PR
      # opened 83 commits back failed this job on em-dashes that were already on main, in
      # files it never touched, and no change to the PR could have cleared it.
      #
      # The real base is the merge base of the base branch and what we have checked out.
      # On a `pull_request` run the checkout is the merge ref, so this resolves to the base
      # branch tip and the diff is exactly the PR's net contribution. Falls back to the
      # event's own sha for push / merge_group, and to the empty string if nothing resolves -
      # which makes both scripts over-scan the whole tree rather than silently check nothing.
      - name: Resolve base for the ASCII checks
        id: ascii-base
        # Both values arrive as env, never interpolated into the script body. `BASE_REF` is a
        # branch name, and git permits `;`, `$()`, backticks, `|` and quotes in a ref, so an
        # inline `${{ }}` would let a crafted base branch break out of the quoting and run
        # arbitrary commands on the runner. Env values are passed as data and are never parsed
        # by the shell, which is also the pattern the two checks below already used.
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          resolved="$EVENT_BASE"
          if [ -n "$BASE_REF" ]; then
            if git fetch --no-tags --quiet origin "$BASE_REF" 2>/dev/null; then
              if merge_base=$(git merge-base FETCH_HEAD HEAD 2>/dev/null); then
                resolved="$merge_base"
              fi
            fi
          fi
          echo "base=$resolved" >> "$GITHUB_OUTPUT"
          echo "ASCII checks diff against ${resolved:-<whole tree>} (event base was ${EVENT_BASE:-<none>})"

      # Mirrors the husky pre-commit guard so a `--no-verify` bypass is still caught.
      - name: Check for raw control bytes in source files
        run: bash scripts/check-no-control-bytes.sh --changed "$CONTROL_BYTES_BASE"
        env:
          CONTROL_BYTES_BASE: ${{ steps.ascii-base.outputs.base }}

      # The other half of the ASCII-only rule. Scans ADDED lines only, so the pre-existing
      # em-dashes in ~645 tracked files do not gate anything; same base resolution as above.
      - name: Check for smart punctuation in added lines
        run: bash scripts/check-no-smart-punctuation.sh --changed "$SMART_PUNCTUATION_BASE"
        env:
          SMART_PUNCTUATION_BASE: ${{ steps.ascii-base.outputs.base }}

      - name: Check deploy contract matches infra
        run: python3 scripts/check-deploy-contract.py

      - name: Check workflows pass values through env, not run-body interpolation
        run: python3 scripts/check-no-run-interpolation.py

      # ComposeIntegrationTests self-skips with a visible reason when docker is
      # unavailable; the rest of the suite needs nothing but the stdlib.
      - name: Run self-host production preflight tests
        run: python3 -m unittest discover -s scripts -p 'test_selfhost_production_preflight.py' -v
        env:
          B4M_PREFLIGHT_COMPOSE_TESTS: '1'

      - name: Test Playwright install recovery
        run: python3 -m unittest discover -s scripts -p 'test_install_playwright_chromium.py' -v

      - name: Check for account-tied IDs in shippable code (open-core)
        run: bash scripts/check-no-account-ids.sh
        env:
          # Real account IDs + brand domain live in CI config, not in the shipped
          # script. Unset on a public fork → those two checks are skipped.
          DENY_ACCOUNT_IDS: ${{ vars.DENY_ACCOUNT_IDS }}
          DENY_BRAND_DOMAINS: ${{ vars.DENY_BRAND_DOMAINS }}

      - name: Verify open-core snapshot export-ignore exclusions
        run: |
          if [ -f scripts/check-export-ignore.sh ]; then
            bash scripts/check-export-ignore.sh
          else
            echo "check-export-ignore.sh absent (post-cut snapshot) — skipping"
          fi

  # Every changed path, any extension: blocked paths, cloud identifiers in added lines. Mirrors
  # the husky pre-commit guard so a `--no-verify` bypass is still caught. Its own job, with no
  # `deployable` gate like repo-guards': a docs-only change is non-deployable, and docs/** and
  # docs-site/** are exactly where planning artifacts and pasted identifiers land. The
  # restricted-term list is not available here (it is a git-ignored local file), so that rule is
  # skipped and the Restricted Terms workflow remains the authority for it.
  leak-shapes:
    runs-on: ${{ github.event_name == 'merge_group' && vars.RUNNER_LABEL_QUEUE || vars.RUNNER_LABEL || 'ubuntu-latest-m' }}
    name: Leak Shapes
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Same base resolution as repo-guards' "Resolve base for the ASCII checks"; see the
      # comment there for why the merge base, not `pull_request.base.sha`. Values arrive as env.
      - name: Resolve base for the leak-shapes check
        id: leak-base
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          resolved="$EVENT_BASE"
          if [ -n "$BASE_REF" ]; then
            if git fetch --no-tags --quiet origin "$BASE_REF" 2>/dev/null; then
              if merge_base=$(git merge-base FETCH_HEAD HEAD 2>/dev/null); then
                resolved="$merge_base"
              fi
            fi
          fi
          echo "base=$resolved" >> "$GITHUB_OUTPUT"
          echo "Leak-shapes check diffs against ${resolved:-<whole tree>} (event base was ${EVENT_BASE:-<none>})"

      - name: Check for leak shapes in changed paths and added lines
        run: bash scripts/check-no-leak-shapes.sh --changed "$LEAK_SHAPES_BASE"
        env:
          LEAK_SHAPES_BASE: ${{ steps.leak-base.outputs.base }}

  typecheck:
    needs: core-build
    # Light tier (RUNNER_LABEL): tsgo (native TS) is fast and low-memory and runs
    # against the prebuilt core artifact, so this leg is I/O-bound, not CPU/memory-bound.
    runs-on: ${{ github.event_name == 'merge_group' && vars.RUNNER_LABEL_QUEUE || vars.RUNNER_LABEL || 'ubuntu-latest-m' }}
    name: Type Check
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pnpm-store
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --recursive

      - name: Download core build artifacts
        id: download-core
        uses: actions/download-artifact@v7
        with:
          name: core-build-${{ needs.core-build.outputs.core-content-hash }}
          # Artifact paths are relative to the repo root (the common ancestor of
          # b4m-core/*/dist and packages/database/dist).
          path: .
        continue-on-error: true

      - name: Build bike4mind core packages (fallback)
        if: steps.download-core.outcome == 'failure'
        run: pnpm core:build

      - name: Run premium glue codegen
        run: pnpm --filter @bike4mind/client run codegen

      - name: Generate SST types
        run: bash scripts/ci-sst-install.sh
        env:
          CI: 'true'

      # Fast typecheck: tsgo (TypeScript 7.0 native) runs first per package; on any
      # failure it falls back to classic tsc, the authoritative gate. All packages
      # are currently tsgo-clean, so tsc only runs if tsgo regresses or diverges.
      # See typecheck-report.md.
      - name: Type check (tsgo, tsc fallback)
        run: pnpm -w typecheck:fast && pnpm --recursive typecheck:fast

      # The root /infra SST files are excluded from the root tsconfig and have no
      # package.json, so neither -w nor --recursive covers them. Typecheck them
      # explicitly here (after SST types are generated above) so infra type errors
      # gate PRs instead of surfacing at deploy time. See #9155.
      - name: Type check infra (SST)
        run: pnpm typecheck:infra

  lint:
    needs: core-build
    # MEDIUM, not the 2-core tier: typed linting (b4m/no-raw-entity-response) holds the client
    # TypeScript program, so ESLint needs 3-4 GB of heap - past Node's RAM-derived default on a
    # 2-core runner. The heap is pinned in the root lint:* scripts, not inherited from the runner.
    runs-on: ${{ github.event_name == 'merge_group' && vars.RUNNER_LABEL_MEDIUM_QUEUE || vars.RUNNER_LABEL_MEDIUM || 'ubuntu-latest-m' }}
    name: Lint
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pnpm-store
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --recursive

      - name: Download core build artifacts
        id: download-core
        uses: actions/download-artifact@v7
        with:
          name: core-build-${{ needs.core-build.outputs.core-content-hash }}
          # Artifact paths are relative to the repo root (the common ancestor of
          # b4m-core/*/dist and packages/database/dist).
          path: .
        continue-on-error: true

      - name: Build bike4mind core packages (fallback)
        if: steps.download-core.outcome == 'failure'
        run: pnpm core:build

      - name: Run premium glue codegen
        run: pnpm --filter @bike4mind/client run codegen

      - name: Generate SST types
        run: bash scripts/ci-sst-install.sh
        env:
          CI: 'true'

      # Uncached on purpose: ESLint's cache keys on the linted file, not the core types the type-aware
      # b4m/no-raw-entity-response rule reads, and node_modules (cache dir included) is restored above.
      - name: Lint (errors only)
        run: pnpm lint:ci

  # OpenAPI contract gate: the spec is generated from the same Zod schemas that
  # validate requests at runtime, so it cannot drift silently - UNLESS a schema
  # change lands without regenerating the committed spec. This job regenerates
  # and fails on any diff, then structurally lints the spec (redocly). Source
  # only: generation runs via tsx (no core build), so this leg needs neither the
  # core-build artifact nor SST types - it depends on `changes` directly.
  openapi:
    needs: changes
    if: needs.changes.outputs.deployable == 'true'
    runs-on: ${{ github.event_name == 'merge_group' && vars.RUNNER_LABEL_QUEUE || vars.RUNNER_LABEL || 'ubuntu-latest-m' }}
    name: OpenAPI Spec
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pnpm-store
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --recursive

      # Also regenerates the @bike4mind/sdk types and operation manifest from the fresh spec.
      - name: Regenerate OpenAPI spec from Zod schemas
        run: pnpm turbo:openapi:generate

      # Fails the PR if a schema change did not regenerate the committed spec or the SDK types built from it.
      - name: Verify committed spec is up to date (no drift)
        run: git diff --exit-code apps/client/public/openapi.json packages/sdk/src/generated

      # Structural lint. Rules + intentional-rule exceptions live in redocly.yaml.
      - name: Lint OpenAPI spec (redocly)
        run: pnpm --package=@redocly/cli@1.34.5 dlx redocly lint apps/client/public/openapi.json

  # Tests run as a matrix of shards so wall time is the slowest shard, not the
  # serial sum. The heavy suites are isolated onto their own runners:
  #   - client 1/3, 2/3, 3/3: the large apps/client unit suite (over a thousand files), split
  #     across three runners by vitest's own `--shard`. Each leg owns its whole box
  #     for file parallelism. Splitting by `--shard` rather than by directory is the
  #     point: vitest slices a hash-sorted list of the resolved file paths, so the
  #     legs tile the file set EXACTLY for any count - no hand-maintained bucket
  #     lists, and a newly added test file cannot land in two legs or in none. The
  #     leg count is pinned by checkClientTestShards.test.ts.
  #   - client-integration: the SAME package and filter as `client`, selected onto
  #     its real-Mongo `*.e2e.test.ts` files by a different script, as one unsharded
  #     leg on two workers. apps/client therefore appears in two lanes; they are
  #     disjoint by construction (the unit lane excludes exactly the glob the
  #     integration lane includes), so nothing runs twice and nothing is dropped.
  #   - workers-server-utils-integration: the same real-Mongo split for apps/workers
  #     and packages/server-utils, combined because each holds only a few files.
  #   - services: by far the heaviest remaining package (test-file count and
  #     Mongo-backed setup cost), alone so it doesn't drag down a shared bucket.
  #   - cli-desktop-workers, data: hand-grouped buckets of the next-heaviest packages. Their
  #     packages run one at a time (see the workspace-concurrency note on the test
  #     step), each with the whole runner's worker pool.
  #   - misc: a NEGATION catch-all (every non-client package minus the ones
  #     explicitly placed above) instead of an explicit include list. This makes
  #     bucket coverage complete by construction: a package with a `test` script
  #     that isn't named in services/cli-desktop-workers/data always lands in misc, so it
  #     can never be silently dropped from the matrix. Moving a package into one
  #     of the named buckets requires adding it there AND excluding it here, or it
  #     will run twice; there's no automated guard against that, so update both
  #     when rebalancing.
  # The `test` job below aggregates these shards into the required "Run Tests"
  # status check.
  test-shards:
    needs: core-build
    # Medium tier, via RUNNER_LABEL_MEDIUM. Pinned to the MEDIUM tier rather than the
    # deploy's HEAVY tier so raising HEAVY (e.g. to ubuntu-latest-l for the deploy runner)
    # does not drag the test-shard fan-out onto the larger, pricier runner. MEDIUM is the
    # 4-core tier for jobs that build core or run a full-pool test suite; the plain
    # RUNNER_LABEL default is the 2-core tier for API, guard and shell-only jobs, and also
    # carries typecheck and the `tier: light` legs here (the 2-worker integration lanes).
    # Size full-pool worker budgets for 4 cores. On merge_group events every job prefers the
    # matching *_QUEUE variable, so the queue can run on a separately capped pool; an unset
    # *_QUEUE variable falls through to the PR label. The isolation is only as real as the
    # variable: a *_QUEUE label equal to its PR label shares the PR pool.
    runs-on: ${{ matrix.shard.tier == 'light' && (github.event_name == 'merge_group' && vars.RUNNER_LABEL_QUEUE || vars.RUNNER_LABEL || 'ubuntu-latest-m') || (github.event_name == 'merge_group' && vars.RUNNER_LABEL_MEDIUM_QUEUE || vars.RUNNER_LABEL_MEDIUM || 'ubuntu-latest-m') }}
    name: Run Tests (${{ matrix.shard.name }})
    # Hard ceiling, not a budget: it costs nothing when a shard finishes early, and its only
    # job is to kill a genuine hang. It was 20, which the client shard's own runtime drifted
    # into - the job was cancelled during cleanup AFTER every test had passed, so a green
    # suite reported red on a coin flip decided by runner speed (#2015). 30 buys headroom over
    # that drift; SHARD_SOFT_BUDGET_SECONDS below is what actually watches for it.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Soft budget: crossing it annotates the run instead of killing it, so the next slow creep
      # surfaces as a warning on a passing build rather than as someone's PR failing for no
      # reason - which was the only signal this had that the client shard had gone from 15
      # minutes to 20.
      #
      # 600, retuned down from the 1200 that matched the client shard's old pre-split runtime.
      # With the client suite split three ways, no leg in this matrix is expected to approach 10
      # minutes - the heaviest non-client leg was 4m51s on the pre-split run - so 1200 could no
      # longer fire for anything and had stopped being an early warning. At 600 it also catches
      # the specific way this split can silently break: if a leg stops sharding it runs the WHOLE
      # suite (~942s in CI) and trips this, rather than just quietly costing 3x for no speedup.
      SHARD_SOFT_BUDGET_SECONDS: '600'

    strategy:
      fail-fast: false
      matrix:
        shard:
          # Single-package shards own the whole runner, so no worker cap.
          #
          # `args` is appended to the test command WITHOUT a `--` separator, and that matters:
          # `pnpm ... test -- --shard=1/3` forwards the literal `--` on to vitest, which then
          # reads everything after it as positional path filters. The shard flag is silently
          # IGNORED and the leg runs the whole suite - measured, it is not a theory. Nothing
          # errors, so all three legs would quietly do the full suite at 3x the cost. Keep the
          # args bare. SHARD_SOFT_BUDGET_SECONDS above is the backstop if this regresses.
          #
          # `mongod: 'skip'` and `sst: 'skip'` drop setup the unit lane never uses, on the legs that
          # are the workflow's critical path: its real-Mongo suites are all `*.e2e.test.ts` (in the
          # integration lane, enforced by apps/client/__tests__/mongoTestTimeoutBudget.test.ts), and
          # vitest neither typechecks nor reads the generated SST types (`sst` is mocked in
          # apps/client/vitest.setup.ts). Together ~45s per leg, mostly the mongod cache's restore
          # and post-job save. Unset on every other leg, which keeps the full setup.
          - name: client 1/3
            tier: medium
            filter: '--filter @bike4mind/client'
            workers: ''
            args: '--shard=1/3'
            mongod: 'skip'
            sst: 'skip'
          - name: client 2/3
            tier: medium
            filter: '--filter @bike4mind/client'
            workers: ''
            args: '--shard=2/3'
            mongod: 'skip'
            sst: 'skip'
          - name: client 3/3
            tier: medium
            filter: '--filter @bike4mind/client'
            workers: ''
            args: '--shard=3/3'
            mongod: 'skip'
            sst: 'skip'
          # The real-Mongo suites (`*.e2e.test.ts`), split off their packages' unit lanes. Each
          # file boots a mongod, and inline they pushed the unit job past `timeout-minutes` even on
          # runs where the suite itself passed. The `script` below is what selects the lane (see
          # each package's vitest.config.mts). Capped workers: these contend for mongod ports, and
          # createMongoServer's retry loop is the documented flake when too many start at once.
          # That cap is also why these legs ride the light tier.
          - name: client-integration
            tier: light
            filter: '--filter @bike4mind/client'
            workers: '2'
            script: 'test:integration'
          # apps/workers and packages/server-utils hold only a few integration files each, so they
          # share one leg. Their unit lanes run in cli-desktop-workers and misc below.
          - name: workers-server-utils-integration
            tier: light
            filter: '--filter @bike4mind/workers --filter @bike4mind/server-utils'
            workers: '2'
            script: 'test:integration'
          - name: services
            tier: medium
            filter: '--filter @bike4mind/services'
            workers: ''
          # The buckets below hold several packages, but the step runs them one at a time, so
          # each still owns the runner and needs no per-package cap.
          # apps/desktop and apps/workers (~145s and ~90s) ride here rather than in `misc`, which
          # otherwise ran ~10 minutes serially and would be the matrix's longest leg once the client
          # shards got faster. This leg was ~90s on its own.
          - name: cli-desktop-workers
            tier: medium
            filter: '--filter @bike4mind/cli --filter @bike4mind/slack --filter @bike4mind/voice --filter @bike4mind/desktop --filter @bike4mind/workers'
            workers: ''
          - name: data
            tier: medium
            filter: '--filter @bike4mind/common --filter @bike4mind/database --filter @bike4mind/db-core --filter @bike4mind/core'
            workers: ''
            # packages/database's ~160 suites each boot a mongod; see TMPDIR on the test step.
            tmpfs: 'true'
          # The catch-all: every workspace package the buckets above do not name. A `filter`
          # value reaches the step as an env var and is split on whitespace into argv, so the
          # tokens here must be BARE. Quotes around a pattern are not shell quoting at this
          # point, they are characters inside the argument pnpm receives, and pnpm then matches
          # nothing. `!` needs no quoting either: history expansion is interactive-only.
          - name: misc
            tier: medium
            filter: '--filter !@bike4mind/client --filter !@bike4mind/services --filter !@bike4mind/cli --filter !@bike4mind/slack --filter !@bike4mind/voice --filter !@bike4mind/desktop --filter !@bike4mind/workers --filter !@bike4mind/common --filter !@bike4mind/database --filter !@bike4mind/db-core --filter !@bike4mind/core'
            workers: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pnpm-store
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --recursive

      - name: Download core build artifacts
        id: download-core
        uses: actions/download-artifact@v7
        with:
          name: core-build-${{ needs.core-build.outputs.core-content-hash }}
          # Artifact paths are relative to the repo root (the common ancestor of
          # b4m-core/*/dist and packages/database/dist).
          path: .
        continue-on-error: true

      - name: Build bike4mind core packages (fallback)
        if: steps.download-core.outcome == 'failure'
        run: pnpm core:build

      - name: Download ripgrep binary (for grep_search tests)
        run: |
          POSTINSTALL_PATH=$(find node_modules/.pnpm -name "postinstall.js" -path "*/@vscode/ripgrep/lib/postinstall.js" -type f | head -1)
          if [ -n "$POSTINSTALL_PATH" ]; then
            node "$POSTINSTALL_PATH"
          fi
        continue-on-error: true

      - name: Run premium glue codegen
        run: pnpm --filter @bike4mind/client run codegen

      - name: Generate SST types
        if: matrix.shard.sst != 'skip'
        run: bash scripts/ci-sst-install.sh
        env:
          CI: 'true'

      # Persist the downloaded mongod binary across runs so the pre-warm below is usually a
      # no-op restore. restore-keys lets a lockfile bump reuse the prior binary (the pre-warm
      # then tops up any new version) instead of a cold download every time.
      - name: Cache mongodb-memory-server binary
        if: matrix.shard.mongod != 'skip'
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-binaries-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-mongodb-binaries-

      # Resolve (download if absent) the mongod binary in a dedicated step, OUTSIDE any test's
      # beforeAll hook budget. Under CI load a cold download + createMongoServer's port-retry
      # loop can blow that budget, timing out the hook and silently skipping the whole file -
      # the #1 flake in #1098. Fail-soft: tests still download on demand if this misses. Uses
      # the same package + default version as createMongoServer, so the same binary is cached.
      - name: Pre-warm mongodb-memory-server binary
        if: matrix.shard.mongod != 'skip'
        continue-on-error: true
        run: >-
          pnpm --filter @bike4mind/database exec node -e
          "require('mongodb-memory-server').MongoBinary.getPath({}).then(p => console.log('mongod binary ready:', p)).catch(e => console.warn('prewarm skipped:', e.message))"

      # Paired with "Report shard duration" at the end of this job. Set before the test steps
      # rather than derived from the job's own start so the number is test runtime, not
      # test runtime plus install and core-build restore.
      - name: Mark shard start
        run: echo "SHARD_START_SECONDS=$(date +%s)" >> "$GITHUB_ENV"

      # `matrix.shard.script` is unset on every shard but the two integration ones, and an unset
      # matrix value is the empty string here, so `||` falls back to the unit `test` script.
      # `matrix.shard.args` is likewise set only on the three client unit legs, where it carries
      # `--shard=i/3` - deliberately with no `--` separator before it, see the matrix
      # entries above for why that is load-bearing.
      - name: Run Tests (${{ matrix.shard.name }})
        env:
          CI: true
          VITEST_MAX_WORKERS: ${{ matrix.shard.workers }}
          # mongod data on tmpfs for the real-Mongo lane. Every file boots a mongod that creates
          # ~200 collections plus their indexes on connect, which is fsync-bound: on a slow runner
          # disk that phase alone ran 5x long while CPU-bound import time did not move, and the
          # lane's timeouts followed it. mongodb-memory-server puts dbPath under os.tmpdir().
          # Scoped to these legs (the integration lanes plus `tmpfs: 'true'`, the data leg's
          # packages/database suites) because unit suites write and exec scripts under the tmpdir,
          # and an empty value falls back to /tmp.
          TMPDIR: ${{ (matrix.shard.script == 'test:integration' || matrix.shard.tmpfs == 'true') && '/dev/shm' || '' }}
          SHARD_NAME: ${{ matrix.shard.name }}
          SHARD_FILTER: ${{ matrix.shard.filter }}
          SHARD_SCRIPT: ${{ matrix.shard.script || 'test' }}
          SHARD_ARGS: ${{ matrix.shard.args }}
        run: |
          # Split each env var on whitespace into a real argv array, so every token arrives at
          # pnpm as its own argument. The matrix values stay in `env:` and are never interpolated
          # into this command line, and there is no `eval`, so a matrix value is only ever data.
          # `read -ra` does no quote processing - the tokens in the matrix must be bare, and
          # checkClientTestShards.test.ts fails the build if one grows a quote character.
          read -ra filter_args <<< "$SHARD_FILTER"
          read -ra script_args <<< "$SHARD_ARGS"

          # A filter set matching no project is not an error to pnpm: it prints "No projects
          # matched the filters" and exits 0, so the leg runs nothing and still reports green -
          # the same silent-success shape the `--dir` note below exists to close. Resolve the set
          # up front and fail loudly when it is empty. `pnpm ls` counts the workspace root as a
          # match where `pnpm run` does not, so drop it: only real packages count.
          matched=$(pnpm --recursive "${filter_args[@]}" ls --depth -1 --parseable | grep -cvxF "$PWD" || true)
          echo "${SHARD_NAME} matches ${matched} package(s)"
          if [ "$matched" -eq 0 ]; then
            echo "::error title=Empty test shard::The ${SHARD_NAME} leg's filters match no workspace package, so it would run no tests. Check the --filter tokens in the matrix."
            exit 1
          fi

          # One package at a time: vitest sizes each package's pool to the whole runner, so N
          # concurrent packages meant N pools (and N sets of mongods) on the same cores, and a
          # per-package cap cannot fix that because pnpm runs dependents last - the heaviest
          # packages (database, scripts) ended up alone on a pool capped at a quarter of the box.
          # Serial with full pools measured faster on the data and misc legs, with no
          # oversubscription by construction. vitestWorkerBudget.test.ts pins this.
          pnpm --recursive --workspace-concurrency=1 "${filter_args[@]}" "$SHARD_SCRIPT" "${script_args[@]}"

      # The scheduler suite is a unit test, so it runs under `test` (the integration lane collects
      # only *.e2e.test.ts). It sets TZ itself at runtime; this step's TZ is for the retention file.
      - name: Verify telemetry retention and worker scheduling across DST
        if: matrix.shard.name == 'workers-server-utils-integration'
        env:
          TZ: America/New_York
          VITEST_MAX_WORKERS: '2'
          TMPDIR: /dev/shm
        run: |
          pnpm --filter @bike4mind/workers test:integration src/cron/telemetryCleanup.retention.e2e.test.ts
          pnpm --filter @bike4mind/workers test src/selfhost/selfHostWorker.dst.test.ts

      # Tests that live outside every pnpm workspace, which the sharded run above cannot reach:
      # infra/ has no package.json, and scripts/codemods and scripts/__tests__ are not in
      # pnpm-workspace.yaml, so `pnpm --recursive ... test` has no project to run in either. They passed locally and
      # nowhere else, which is worse than having no tests - infra/__tests__ holds the guard that
      # is meant to fail the build when a WAF shadow rule flips from Count to Block, and it could
      # not have.
      #
      # Pinned to the misc shard, the negative-filter catch-all, so this runs exactly once rather
      # than once per matrix leg.
      #
      # `--dir` rather than a path argument: a bare `vitest run infra/` is a SUBSTRING filter, so
      # it also collects packages/database/src/models/infra/**, whose model tests need that
      # package's own vitest setup and fail under the root config (30 files, 16 failures). The
      # preview gate's path glob is anchored against the same trap.
      #
      # `pnpm exec`, not `pnpm vitest`: the latter resolves as a recursive script and errors with
      # "Command vitest not found" even though vitest is a root devDependency.
      #
      # A directory with no test files exits non-zero, so moving or renaming these files reddens
      # CI instead of quietly reporting success - which is the failure mode this step exists to
      # end.
      - name: Run root-level tests (outside pnpm workspaces)
        if: matrix.shard.name == 'misc'
        run: |
          pnpm exec vitest run --dir infra
          pnpm exec vitest run --dir scripts/codemods
          pnpm test:scripts
        env:
          CI: true
          VITEST_MAX_WORKERS: ${{ matrix.shard.workers }}

      # Reports, never fails. Before this, the only signal that a shard's runtime had crept was
      # a PR going red for no reason once the creep crossed `timeout-minutes` (#2015) - by which
      # point the information arrives as a broken build rather than as a trend. A duration on
      # every run, plus a warning annotation once a shard passes its soft budget, makes the
      # slide visible while the build is still green.
      #
      # `always()` so a FAILING shard still reports: a shard that failed because it was slow is
      # the exact run where the number is worth having. Guarded on SHARD_START_SECONDS being set
      # so an early failure (before the mark step) reports nothing instead of nonsense.
      - name: Report shard duration
        if: always() && env.SHARD_START_SECONDS != ''
        env:
          SHARD_NAME: ${{ matrix.shard.name }}
        run: |
          elapsed=$(( $(date +%s) - SHARD_START_SECONDS ))
          summary=$(printf '%s: %dm%02ds' "$SHARD_NAME" "$(( elapsed / 60 ))" "$(( elapsed % 60 ))")
          echo "- Run Tests (${summary})" >> "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt "$SHARD_SOFT_BUDGET_SECONDS" ]; then
            echo "::warning title=Slow test shard::${summary} - over its ${SHARD_SOFT_BUDGET_SECONDS}s soft budget. Not a failure: split or speed up the shard before it reaches the job timeout."
          fi

  # Aggregate gate for the sharded test matrix. Branch protection requires a
  # status check literally named "Run Tests"; the matrix above reports per-shard
  # names ("Run Tests (client 1/3)", …), so this job re-exposes the exact required
  # context and passes only when every shard succeeded.
  test:
    name: Run Tests
    needs: [changes, test-shards]
    # Run whenever the gate said deployable (!cancelled() within that, so a failed
    # shard is still caught by the assertion below). On a non-deployable run the
    # shards were skipped, so this aggregator skips too — a skipped required
    # check counts as passing, instead of failing on skipped shards.
    # Not `always()`: that also runs in a run cancelled by cancel-in-progress, where the
    # cancelled shards fail the assertion and post a false red for a SHA nothing tested.
    # Keep the block scalar: a bare `if: !cancelled() && ...` is a YAML tag indicator.
    if: |
      !cancelled() && needs.changes.outputs.deployable == 'true'
    runs-on: ${{ github.event_name == 'merge_group' && vars.RUNNER_LABEL_QUEUE || vars.RUNNER_LABEL || 'ubuntu-latest-m' }}
    permissions:
      contents: read
    steps:
      - name: Verify all test shards passed
        env:
          SHARDS_RESULT: ${{ needs.test-shards.result }}
        run: |
          result="$SHARDS_RESULT"
          echo "test-shards result: $result"
          test "$result" = "success"

  # Dedicated job for the CLI end-to-end harness (packages/cli/test/e2e/). Kept
  # separate from both the unit `test-shards` matrix and the `test` fan-in gate
  # so it has its own toolchain setup, its own visible status check, and runs in
  # parallel with the unit shards (both only need `core-build`).
  #
  # The harness lives in a separate `test:e2e` script that `pnpm --recursive
  # test` does not run, so it must be invoked explicitly. The build step
  # populates dist/ first: the bundle-size baseline checks read real dist/ and a
  # guard test fails loudly in CI if dist/ is missing, so a size regression
  # can't slip through by silently skipping. This is the gate that protects the
  # packages/cli/src/index.tsx decomposition (#8554).
  cli-e2e:
    name: CLI e2e harness
    needs: core-build
    # Standard runner: builds the CLI and runs the bundle-baseline harness — a
    # light, I/O-bound leg. Off the capped ubuntu-latest-m pool to free a slot.
    runs-on: ${{ github.event_name == 'merge_group' && vars.RUNNER_LABEL_QUEUE || vars.RUNNER_LABEL || 'ubuntu-latest-m' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pnpm-store
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --recursive

      - name: Download core build artifacts
        id: download-core
        uses: actions/download-artifact@v7
        with:
          name: core-build-${{ needs.core-build.outputs.core-content-hash }}
          # Artifact paths are relative to the repo root (the common ancestor of
          # b4m-core/*/dist and packages/database/dist).
          path: .
        continue-on-error: true

      - name: Build bike4mind core packages (fallback)
        if: steps.download-core.outcome == 'failure'
        run: pnpm core:build

      - name: Run premium glue codegen
        run: pnpm --filter @bike4mind/client run codegen

      - name: Generate SST types
        run: bash scripts/ci-sst-install.sh
        env:
          CI: 'true'

      # Build the CLI so the e2e bundle-baseline checks run against real dist/.
      - name: Build CLI (for e2e bundle baseline)
        run: pnpm --filter @bike4mind/cli build

      - name: Run CLI e2e harness
        run: pnpm --filter @bike4mind/cli test:e2e
        env:
          CI: true

  # Help guards for docs-touching runs. The help suites assert invariants that span
  # docs-site/ and apps/client (every hard-coded help slug names a real article; the
  # generated index covers exactly the corpus), and until now they only ran inside
  # `test-shards` - which `needs: core-build`, gated on `deployable == 'true'`. Since
  # `docs-site/**` is on the non-deployable exclude list, a docs-only PR skipped every
  # shard, and a skipped required check counts as passing. So the guard fired in one
  # direction only: break a helpId in a .tsx and CI caught it; rename or delete an
  # article and forget the helpId and it shipped green. That second direction is exactly
  # how the admin feedback help slug came to disagree with the component that names it.
  #
  # Gated on `docs-changed` (not `!deployable`) so "docs changed => help guards ran"
  # holds regardless of deployability. On a deployable docs PR the suites also run in
  # the shards; the duplicate is ~1 min and worth the unconditional guarantee.
  #
  # This leg used to need no core build - the help tooling imported only glob/gray-matter.
  # `ingestHelpDatalake.ts` now pulls in @bike4mind/common, whose package entries all point
  # at dist/, so the suite fails to LOAD without it (not an assertion failure - a resolve
  # error). `needs: core-build` alone would be a regression: core-build is gated on
  # `deployable`, and a docs-only PR is non-deployable, so this job would inherit that skip
  # and go quiet on exactly the changes it exists to guard. Hence the explicit `if` that
  # keeps the `docs-changed` gate and tolerates core-build having been skipped, plus the
  # artifact download with a local build as fallback.
  #
  # `!cancelled()` rather than `always()`: both lift the implicit `success()` on `needs` (which
  # is what lets a skipped core-build through), but `always()` also survives run cancellation,
  # and `cancel-in-progress` is on for PRs. A second push would cancel the run and this job
  # would still claim a runner for a full install + core build + vitest on a superseded SHA -
  # costly where runner slots are the queue bottleneck (see the concurrency note at the top).
  # `needs.core-build.result != 'failure'` rather than an allowlist of success/skipped: a
  # core-build that ends `cancelled` (runner loss) is not a build failure, and the allowlist
  # form skipped this job on it while ci-complete only reddens on the literal `failure` - so
  # the help guards could go missing on a green docs PR. The fallback build covers that case.
  # Keep the block scalar: a bare `if: !cancelled() && ...` is a YAML tag indicator, not text.
  help-docs:
    name: Help Docs Guards
    needs: [changes, core-build]
    if: |
      !cancelled() &&
      needs.changes.outputs.docs-changed == 'true' &&
      needs.core-build.result != 'failure'
    runs-on: ${{ github.event_name == 'merge_group' && vars.RUNNER_LABEL_QUEUE || vars.RUNNER_LABEL || 'ubuntu-latest-m' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pnpm-store
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --recursive

      - name: Download core build artifacts
        id: download-core
        uses: actions/download-artifact@v7
        with:
          name: core-build-${{ needs.core-build.outputs.core-content-hash }}
          # Artifact paths are relative to the repo root (the common ancestor of
          # b4m-core/*/dist and packages/database/dist).
          path: .
        continue-on-error: true

      # Covers both misses: core-build skipped (docs-only run, so no artifact and an empty
      # name above) and a genuine download failure.
      - name: Build bike4mind core packages (fallback)
        if: steps.download-core.outcome == 'failure'
        run: pnpm core:build

      - name: Run help corpus and help-id suites
        run: pnpm --filter @bike4mind/scripts exec vitest run help/__tests__
        env:
          CI: true

      # Smoke check, not a fixture: no suite above reads the generated file, they all compare
      # docs-site against source. What it adds over build-help-index.test.ts (which uses a
      # fixture loader) is the write path over the REAL corpus, which nothing commits any more.
      # Runs after the suites so a generator break cannot mask their more informative output.
      # Keyless - the vectors need a credential and are a deploy-time step, not built here.
      - name: Generate the help index
        run: pnpm --filter @bike4mind/scripts help:build-index

      # The other half of the image prebuild's help:build. Docs-only PRs no longer run
      # selfhost-image, so this is what still fails them on a copy or media-policy error.
      - name: Bundle the help content
        run: pnpm --filter @bike4mind/scripts help:bundle-content

  # Type-checks the packed @bike4mind/* declarations as a consumer would (see
  # scripts/check-published-dts.mjs). Needs core-build for the dist/ it packs.
  published-dts:
    name: Published Declarations
    needs: [changes, core-build]
    if: needs.changes.outputs.published-changed == 'true'
    runs-on: ${{ github.event_name == 'merge_group' && vars.RUNNER_LABEL_QUEUE || vars.RUNNER_LABEL || 'ubuntu-latest-m' }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pnpm-store
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --recursive

      - name: Download core build artifacts
        id: download-core
        uses: actions/download-artifact@v7
        with:
          name: core-build-${{ needs.core-build.outputs.core-content-hash }}
          path: .
        continue-on-error: true

      - name: Build bike4mind core packages (fallback)
        if: steps.download-core.outcome == 'failure'
        run: pnpm core:build

      # The consumer install has no lockfile, so the key tracks the manifests being packed instead.
      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-published-dts-${{ hashFiles('b4m-core/*/package.json', 'packages/sdk/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-published-dts-

      # The consumer installs third-party deps at their newest in-range versions, so an upstream type break can fail
      # this job. That is intended: real consumers resolve the same versions.
      - name: Check published declarations
        run: node scripts/check-published-dts.mjs

  verify-docs-build:
    name: Verify Docs Build
    needs: changes
    if: needs.changes.outputs.docs-changed == 'true'
    uses: ./.github/workflows/_verify-docs-build.yml
    permissions:
      contents: read
      pull-requests: write

  # Pre-merge sensitive-term scan: a private workflow scans docs-site PRs and posts a `docs/sensitive-scan`
  # commit status on the PR head. This job turns that status into a gate through `ci-complete`, since a
  # required status that only some PRs ever receive would block every other PR. Merge queue runs skip it
  # (the PR head was already gated). Fails closed if the status never arrives.
  docs-scan-gate:
    name: Docs Sensitive Scan
    needs: changes
    if: needs.changes.outputs.docs-changed == 'true' && github.event_name == 'pull_request'
    runs-on: ${{ github.event_name == 'merge_group' && vars.RUNNER_LABEL_QUEUE || vars.RUNNER_LABEL || 'ubuntu-latest-m' }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - name: Wait for the docs scan result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          FILES=$(gh api --paginate "repos/${REPO}/pulls/${PR}/files" --jq '.[].filename') || { echo "::error::could not list PR files"; exit 1; }
          if ! printf '%s\n' "$FILES" | grep -q '^docs-site/'; then
            echo "No docs-site files in this PR, scan not required."
            exit 0
          fi
          for _ in $(seq 1 48); do
            STATE=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/statuses" --jq '[.[] | select(.context == "docs/sensitive-scan")][0].state // "missing"')
            echo "docs/sensitive-scan: ${STATE}"
            case "$STATE" in
              success) exit 0 ;;
              failure|error) echo "::error::The docs sensitive-term scan failed for this commit. Remove the flagged content and push, or once a maintainer re-runs the scan to success, re-run this job."; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::No docs/sensitive-scan result after 16 minutes. Ask a maintainer to re-run the scan, then re-run this job once it reports success."
          exit 1

  # ============================================================
  # CI gate aggregation. The main branch ruleset (main-protection)
  # requires a single status check named exactly "CI Complete". Deploy moved out
  # of this repo to the internal deployer, so there is no deploy to gate; this
  # job re-exposes one stable check that turns red if any CI leg failed.
  #
  # Red when ANY CI leg (changes/core-build/repo-guards/typecheck/lint/test-shards/cli-e2e/help-docs/
  # verify-docs-build/docs-scan-gate/published-dts)
  # genuinely FAILED. Green when everything succeeded OR was legitimately
  # skipped (a non-deployable change skips core-build..cli-e2e and repo-guards, and a skipped
  # required check counts as passing). This surfaces typecheck/lint/cli-e2e
  # failures (none of which are individually required checks) through the one
  # required "CI Complete" check instead of letting them pass silently.
  #
  # `!cancelled()` rather than `always()`: in a run cancelled by cancel-in-progress the unfinished
  # legs end `cancelled`, not the literal `failure`, so `always()` reported a false green on the
  # required check with nothing tested. Gated this way the job itself ends `cancelled`.
  #
  # Needs `test-shards` directly, not the `test` aggregator, so the two fan-in
  # jobs wait for a runner side by side instead of in series: under runner
  # contention each serial hop costs ~10-15 min of queue wait for ~5 s of work.
  # The shard assertion below must stay equivalent to the one in `test`.
  #
  # NOTE: this job name IS the required-check context. Renaming it must happen
  # in lockstep with editing both rulesets, or a required check with no matching
  # job hangs every PR.
  # ============================================================
  ci-complete:
    name: CI Complete
    needs:
      - changes
      - core-build
      - repo-guards
      - leak-shapes
      - typecheck
      - lint
      - openapi
      - test-shards
      - cli-e2e
      - help-docs
      - verify-docs-build
      - docs-scan-gate
      - published-dts
    if: ${{ !cancelled() }}
    runs-on: ${{ github.event_name == 'merge_group' && vars.RUNNER_LABEL_QUEUE || vars.RUNNER_LABEL || 'ubuntu-latest-m' }}
    permissions:
      contents: read
    steps:
      - name: Report CI result
        env:
          CHANGES: ${{ needs.changes.result }}
          CORE_BUILD: ${{ needs.core-build.result }}
          REPO_GUARDS: ${{ needs.repo-guards.result }}
          LEAK_SHAPES: ${{ needs.leak-shapes.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          LINT: ${{ needs.lint.result }}
          OPENAPI: ${{ needs.openapi.result }}
          DEPLOYABLE: ${{ needs.changes.outputs.deployable }}
          TEST_SHARDS: ${{ needs.test-shards.result }}
          CLI_E2E: ${{ needs.cli-e2e.result }}
          HELP_DOCS: ${{ needs.help-docs.result }}
          VERIFY_DOCS: ${{ needs.verify-docs-build.result }}
          DOCS_SCAN: ${{ needs.docs-scan-gate.result }}
          PUBLISHED_DTS: ${{ needs.published-dts.result }}
        run: |
          echo "results: changes=$CHANGES core-build=$CORE_BUILD repo-guards=$REPO_GUARDS leak-shapes=$LEAK_SHAPES typecheck=$TYPECHECK lint=$LINT openapi=$OPENAPI test-shards=$TEST_SHARDS cli-e2e=$CLI_E2E help-docs=$HELP_DOCS verify-docs-build=$VERIFY_DOCS docs-scan=$DOCS_SCAN published-dts=$PUBLISHED_DTS"
          # Same rule as the `test` aggregator: on a deployable run every shard must succeed.
          if [ "$DEPLOYABLE" = "true" ] && [ "$TEST_SHARDS" != "success" ]; then
            echo "::error::Test shards did not all pass; failing the required check."
            exit 1
          fi
          # A CI leg that genuinely failed flips the check red. Skipped
          # (non-deployable change) is treated as passing.
          for r in "$CHANGES" "$CORE_BUILD" "$REPO_GUARDS" "$LEAK_SHAPES" "$TYPECHECK" "$LINT" "$OPENAPI" "$CLI_E2E" "$HELP_DOCS" "$VERIFY_DOCS" "$DOCS_SCAN" "$PUBLISHED_DTS"; do
            if [ "$r" = "failure" ]; then
              echo "::error::A CI gate failed; failing the required check."
              exit 1
            fi
          done
          echo "CI succeeded or was legitimately skipped."
