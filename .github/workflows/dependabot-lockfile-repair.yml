name: Dependabot Lockfile Repair

# Dependabot's update sandbox writes the CDN-hosted xlsx tarball into
# pnpm-lock.yaml as a bare `{tarball: ...}` with no integrity hash, even though it
# runs the pinned pnpm 10.34.1 (the same commands keep the hash locally; root
# cause unconfirmed, likely its caching proxy). The Lockfile Integrity guard
# (lockfile-integrity.yml) then blocks the PR. This job restores the hash by copying
# the base branch's entry for the identical URL and pushes one bot commit.
#
# Why pull_request_target: a pull_request run triggered by Dependabot gets no
# Actions secrets and a read-only token, so it can't mint the release-app token
# that both pushes and re-triggers CI (a GITHUB_TOKEN push would not). Adding
# a Dependabot secret is not an option. pull_request_target runs in the base
# context with Actions secrets; cla.yml already mints this token the same way on
# Dependabot PRs, and auto-changeset.yml pushes with it.
#
# SAFETY: the workflow and repair script come from the base checkout. The PR
# head is checked out to pr/ as DATA ONLY: never run anything from pr/ (no
# pnpm/npm/node, no scripts, no sourcing), and commit with hooks disabled. The
# repair is a pure text substitution against the base lockfile.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dependabot-lockfile-repair-${{ github.event.pull_request.number }}
  # Only a newer Dependabot push supersedes a run; the bot's own repair push must not
  # cancel the run that made it while its cleanup and token-revoke steps finish.
  cancel-in-progress: ${{ github.actor == 'dependabot[bot]' }}

jobs:
  repair:
    # Dependabot's own pushes only: the bot's repair push (actor
    # bike4mind-release-bot[bot]) skips, so it can't loop, and so does a
    # human pushing to a Dependabot branch.
    if: >-
      github.repository == (vars.CANONICAL_REPO || 'MillionOnMars/lumina5') &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest-m' }}
    timeout-minutes: 5
    steps:
      # Base commit: the trusted repair script and the reference lockfile.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Least privilege: this token sits beside an untrusted checkout.
          permission-contents: write

      # PR head as data only. The token persists in pr/.git/config for the push.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          token: ${{ steps.app-token.outputs.token }}

      - name: Restore integrity hashes
        run: |
          if ! bash .github/scripts/repair-lockfile-integrity.sh pr/pnpm-lock.yaml pnpm-lock.yaml 2>missing.txt; then
            urls=$(paste -sd ' ' missing.txt)
            echo "::error::pnpm-lock.yaml has tarball entries with no integrity hash and no hashed entry on main to copy: $urls. Regenerate the lockfile locally (outside Dependabot) with the pinned pnpm and push the integrity hash by hand."
            exit 1
          fi

      - name: Commit and push
        env:
          HUSKY: '0'
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git -C pr diff --quiet -- pnpm-lock.yaml; then
            echo "No integrity-less tarball entries; nothing to repair."
            exit 0
          fi
          git -C pr -c core.hooksPath=/dev/null \
            -c user.name='b4m-release-bot[bot]' \
            -c user.email='b4m-release-bot[bot]@users.noreply.github.com' \
            commit -m 'fix(deps): restore tarball integrity in pnpm-lock.yaml' -- pnpm-lock.yaml
          # A plain push from the head SHA fails on a race rather than clobbering a
          # newer Dependabot push; that push re-runs this job.
          git -C pr -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$HEAD_REF"
