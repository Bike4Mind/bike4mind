name: Desktop Release

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'b4m-core/**'
      - 'packages/cli/**'
      - 'packages/database/**'
      - 'packages/sdk/**'
      - 'packages/typescript-config/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.npmrc'
      - '.github/workflows/desktop-release.yml'
      - 'scripts/desktop_release_version.py'
      - 'scripts/test_desktop_release_version.py'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'b4m-core/**'
      - 'packages/cli/**'
      - 'packages/database/**'
      - 'packages/sdk/**'
      - 'packages/typescript-config/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.npmrc'
      - '.github/workflows/desktop-release.yml'
      - 'scripts/desktop_release_version.py'
      - 'scripts/test_desktop_release_version.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  version:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test semantic version selection
        run: python3 -m unittest discover -s scripts -p test_desktop_release_version.py -v
      - name: Test update feed
        run: python3 -m unittest discover -s apps/desktop/scripts -p 'test_*.py' -v
      - name: Choose installer version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/desktop_release_version.py
      - uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: desktop-release-notes.md
          retention-days: 1

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      DESKTOP_VERSION: ${{ needs.version.outputs.version }}
      B4M_DEFAULT_API_URL: ${{ vars.B4M_DEFAULT_API_URL }}
      # Baked into the app; the AppImage gets none because only a macOS feed is published.
      B4M_UPDATE_FEED_URL: ${{ matrix.platform == 'mac' && (vars.B4M_UPDATE_FEED_URL || format('{0}/{1}/releases/download/desktop-feed', github.server_url, github.repository)) || '' }}
      VITEST_MAX_WORKERS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm turbo:core:build
      - name: Check desktop types
        run: pnpm --filter @bike4mind/desktop typecheck
      - name: Test desktop
        run: pnpm --filter @bike4mind/desktop test
      - name: Package installers
        if: matrix.platform != 'mac' || github.event_name == 'pull_request' || vars.DESKTOP_MAC_SIGNING != 'true'
        working-directory: apps/desktop
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm build
          if [ "$PLATFORM" = mac ]; then
            pnpm exec electron-builder --mac dmg zip "--$ARCH" --publish never "-c.extraMetadata.version=$DESKTOP_VERSION"
          else
            pnpm exec electron-builder --linux --publish never "-c.extraMetadata.version=$DESKTOP_VERSION"
          fi
      - name: Sign and notarize macOS installers
        if: matrix.platform == 'mac' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DESKTOP_MAC_SIGNING == 'true'
        working-directory: apps/desktop
        env:
          ARCH: ${{ matrix.arch }}
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.DESKTOP_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.DESKTOP_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
          B4M_DESKTOP_SIGNED: 'true'
        run: |
          for key in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!key}" ]; then echo "Missing signing credential: $key"; exit 1; fi
          done
          pnpm build
          pnpm exec electron-builder --mac dmg zip "--$ARCH" --publish never -c.forceCodeSigning=true -c.mac.notarize=true "-c.extraMetadata.version=$DESKTOP_VERSION"
          app_dir=release/mac
          if [ "$ARCH" = arm64 ]; then app_dir=release/mac-arm64; fi
          codesign --verify --deep --strict "$app_dir/Bike4Mind.app"
          xcrun stapler validate "release/Bike4Mind-$DESKTOP_VERSION-$ARCH.dmg"
      - name: Install Linux smoke test runtime
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm1 libasound2t64
      - name: Launch packaged Linux AppImage
        if: matrix.platform == 'linux'
        timeout-minutes: 3
        run: xvfb-run -a node apps/desktop/scripts/smoke-packaged.mjs
      - name: Install and launch packaged macOS DMG
        if: matrix.platform == 'mac'
        timeout-minutes: 3
        run: |
          install_dir=$(mktemp -d)
          mount_dir="$install_dir/mount"
          mkdir -p "$mount_dir"
          trap 'hdiutil detach "$mount_dir" -quiet || true; rm -rf "$install_dir"' EXIT
          arch=$(node -p 'process.arch')
          hdiutil attach "apps/desktop/release/Bike4Mind-$DESKTOP_VERSION-$arch.dmg" -readonly -nobrowse -mountpoint "$mount_dir"
          ditto "$mount_dir/Bike4Mind.app" "$install_dir/Bike4Mind.app"
          hdiutil detach "$mount_dir" -quiet
          node apps/desktop/scripts/smoke-packaged.mjs "$install_dir/Bike4Mind.app/Contents/MacOS/Bike4Mind"
      - name: Upload packaged startup evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}-smoke-results
          path: apps/desktop/smoke-results/
          retention-days: 3
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage

  validate:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.installers.outputs.version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          merge-multiple: true
          path: installers
      - name: Validate and checksum installers
        id: installers
        working-directory: installers
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          files = sorted(p.name for p in Path('.').iterdir())
          versions = [re.fullmatch(r'Bike4Mind-(\d+\.\d+\.\d+(?:-pr\.\d+\.\d+)?)-arm64\.dmg', f) for f in files]
          versions = [m.group(1) for m in versions if m]
          if len(versions) != 1:
              raise SystemExit('Expected exactly one arm64 DMG')
          version = versions[0]
          expected = {
              f'Bike4Mind-{version}-arm64.dmg', f'Bike4Mind-{version}-x64.dmg',
              f'Bike4Mind-{version}-arm64.zip', f'Bike4Mind-{version}-x64.zip',
              f'Bike4Mind-{version}-x64.AppImage',
          }
          if set(files) != expected:
              raise SystemExit(f'Unexpected installer set: {files}')
          if any(Path(f).stat().st_size == 0 for f in files):
              raise SystemExit('Empty installer')
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
          sha256sum -- *.dmg *.zip *.AppImage > SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        with:
          name: installer-checksums
          path: installers/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          merge-multiple: true
          path: installers
      - uses: actions/download-artifact@v7
        with:
          name: installer-checksums
          path: installers
      - uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: notes
      - name: Publish desktop release
        env:
          DESKTOP_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TARGET: ${{ github.sha }}
          SIGNED: ${{ vars.DESKTOP_MAC_SIGNING == 'true' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf '\nmacOS signing and notarization enabled: %s\n' "$SIGNED" >> notes/desktop-release-notes.md
          (cd installers && sha256sum --check SHA256SUMS.txt)
          bash apps/desktop/scripts/publish-release.sh installers notes/desktop-release-notes.md
          printf 'Desktop release: https://github.com/%s/releases/tag/desktop-v%s\n' "$GH_REPO" "$DESKTOP_VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish update feed
        env:
          DESKTOP_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TARGET: ${{ github.sha }}
          SIGNED: ${{ vars.DESKTOP_MAC_SIGNING == 'true' }}
          ASSET_BASE: ${{ format('{0}/{1}/releases/download/desktop-v{2}', github.server_url, github.repository, needs.validate.outputs.version) }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view desktop-feed >/dev/null 2>&1; then
            gh release create desktop-feed --target "$RELEASE_TARGET" --latest=false --title 'Desktop update feed' \
              --notes 'Read by the desktop app to find updates. Installers are on the desktop-v* releases.'
          fi
          gh release download desktop-feed --pattern latest-mac.yml --dir previous-feed || true
          # Hash what users will download: a rerun leaves published assets unchanged, and a rebuild is not byte-identical.
          gh release download "desktop-v$DESKTOP_VERSION" --pattern '*.zip' --dir published
          python3 apps/desktop/scripts/update_feed.py --installers published --version "$DESKTOP_VERSION" \
            --asset-base "$ASSET_BASE" --notes notes/desktop-release-notes.md --signed "$SIGNED" \
            --previous previous-feed/latest-mac.yml --out feed/latest-mac.yml
          if [ -f feed/latest-mac.yml ]; then gh release upload desktop-feed feed/latest-mac.yml --clobber; fi
