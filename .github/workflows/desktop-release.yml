name: Desktop Release

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-release.yml'
      - 'scripts/desktop_release_version.py'
      - 'scripts/test_desktop_release_version.py'
      - 'scripts/desktop_affected.py'
      - 'scripts/test_desktop_affected.py'
      - 'catalog/model-hub/**'
      - 'b4m-core/local-models/**'
      - 'b4m-core/common/src/schemas/modelHub.ts'
      - 'packages/scripts/src/curatedCatalog/checkDesktopBuild.ts'
      - 'packages/scripts/src/curatedCatalog/devKey.ts'
      - 'packages/scripts/src/curatedCatalog/cli.ts'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-release.yml'
      - 'scripts/desktop_release_version.py'
      - 'scripts/test_desktop_release_version.py'
      - 'scripts/desktop_affected.py'
      - 'scripts/test_desktop_affected.py'
      - 'catalog/model-hub/**'
      - 'b4m-core/local-models/**'
      - 'b4m-core/common/src/schemas/modelHub.ts'
      - 'packages/scripts/src/curatedCatalog/checkDesktopBuild.ts'
      - 'packages/scripts/src/curatedCatalog/devKey.ts'
      - 'packages/scripts/src/curatedCatalog/cli.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  version:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      reclaim: ${{ steps.version.outputs.reclaim }}
      feed: ${{ steps.feed.outputs.feed }}
      repository-name: ${{ steps.feed.outputs.repository-name }}
      mac-mode: ${{ steps.mac-policy.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test semantic version selection
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          python3 -m unittest discover -s scripts -p 'test_desktop_*.py' -v
      - name: Test desktop release scripts
        run: python3 -m unittest discover -s apps/desktop/scripts -p 'test_*.py' -v
      - name: Validate isolated distribution feed
        id: feed
        env:
          DESKTOP_RELEASE_REPOSITORY: ${{ vars.DESKTOP_RELEASE_REPOSITORY }}
        run: python3 apps/desktop/scripts/distribution.py feed
      - name: Choose installer version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RELEASE_REPOSITORY: ${{ vars.DESKTOP_RELEASE_REPOSITORY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          CHANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: python3 scripts/desktop_release_version.py
      - name: Select macOS signing policy
        id: mac-policy
        if: steps.version.outputs.release == 'true'
        env:
          DESKTOP_VERSION: ${{ steps.version.outputs.version }}
          SIGNING: ${{ vars.DESKTOP_MAC_SIGNING }}
          SELFSIGNED_BETA: ${{ vars.DESKTOP_MAC_SELFSIGNED_BETA }}
          ADHOC_BETA: ${{ vars.DESKTOP_MAC_ADHOC_BETA }}
        run: python3 apps/desktop/scripts/mac_release_policy.py
      - uses: actions/upload-artifact@v6
        if: steps.version.outputs.release == 'true'
        with:
          name: release-notes
          path: desktop-release-notes.md
          retention-days: 1

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ${{ vars.OSX_RUNNER_LABEL || 'macos-26-runner' }}
            platform: mac
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: windows-2025
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      DESKTOP_VERSION: ${{ needs.version.outputs.version }}
      B4M_DEFAULT_API_URL: ${{ vars.B4M_DEFAULT_API_URL }}
      B4M_UPDATE_FEED_URL: ${{ needs.version.outputs.feed }}
      # Baked into the app; once set, it only offers update manifests signed by the sign job's key.
      B4M_UPDATE_PUBLIC_KEYS: ${{ vars.DESKTOP_UPDATE_PUBLIC_KEYS }}
      B4M_CURATED_MANIFEST_URL: ${{ vars.B4M_CURATED_MANIFEST_URL }}
      # The URL curated:publish serves the list at; curated:check-build fails a build that baked any other.
      CURATED_PUBLIC_URL: ${{ vars.CURATED_PUBLIC_URL }}
      VITEST_MAX_WORKERS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm turbo:core:build
      - name: Check desktop types
        run: pnpm --filter @bike4mind/desktop typecheck
      # The desktop unit suite and the local tool layer it covers assume a POSIX shell and
      # paths, so Windows runs only the packaging script tests until that layer is ported.
      - name: Test desktop
        if: matrix.platform != 'win'
        run: pnpm --filter @bike4mind/desktop test
      - name: Test desktop packaging script
        if: matrix.platform == 'win'
        run: pnpm --filter @bike4mind/desktop exec node --test scripts/test_package_local.cjs
      - name: Check updater transport with temporary profiles
        if: matrix.platform == 'linux'
        run: node apps/desktop/scripts/smoke-updater.cjs
      - uses: actions/setup-python@v6
        if: matrix.platform == 'linux'
        with:
          python-version: '3.12'
      - name: Check embedded blockmap differential downloads
        if: matrix.platform == 'linux'
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          node apps/desktop/scripts/smoke-differential.cjs
      # Every mode and event: it signs a test-identity build with throwaway certificates, so it needs no secrets.
      - name: Check a self-signed macOS build updates itself
        if: matrix.platform == 'mac'
        timeout-minutes: 20
        run: node apps/desktop/scripts/smoke-mac-update.mjs
      - name: Package installers
        if: matrix.platform != 'mac' || needs.version.outputs.mac-mode == 'adhoc'
        working-directory: apps/desktop
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          if [ "$PLATFORM" = mac ]; then
            B4M_UPDATE_FEED_URL='' pnpm build
          else
            pnpm build
          fi
          pnpm --filter @bike4mind/scripts curated:check-build out --expect-url "$CURATED_PUBLIC_URL" --also-scan ../../b4m-core/local-models/dist
          node scripts/sign-update-manifests.mjs check-build out
          if [ "$PLATFORM" = mac ]; then
            for key in CSC_LINK CSC_KEY_PASSWORD CSC_KEYCHAIN CSC_NAME; do
              if [ -n "${!key:-}" ]; then echo "Certificate credentials are not allowed in ad-hoc packaging: $key"; exit 1; fi
            done
            CSC_FOR_PULL_REQUEST=true pnpm exec electron-builder --mac dmg zip "--$ARCH" --publish never -c.mac.identity=- -c.publish.provider=generic "-c.publish.url=$B4M_UPDATE_FEED_URL" "-c.extraMetadata.version=$DESKTOP_VERSION"
            app_dir=release/mac
            if [ "$ARCH" = arm64 ]; then app_dir=release/mac-arm64; fi
            codesign --verify --deep --strict "$app_dir/Bike4Mind.app"
          elif [ "$PLATFORM" = win ]; then
            pnpm exec electron-builder --win --publish never -c.publish.provider=generic "-c.publish.url=$B4M_UPDATE_FEED_URL" "-c.extraMetadata.version=$DESKTOP_VERSION"
            # 7z can exit non-zero on warnings (an Authenticode signature, for one); the grep decides.
            contents=$(7z l "release/Bike4Mind-$DESKTOP_VERSION-setup.exe") || true
            for archive in app-64.7z app-arm64.7z; do
              grep -qF "$archive" <<< "$contents" || { echo "Installer is missing $archive"; exit 1; }
            done
          else
            pnpm exec electron-builder --linux --publish never -c.publish.provider=generic "-c.publish.url=$B4M_UPDATE_FEED_URL" "-c.extraMetadata.version=$DESKTOP_VERSION"
          fi
      - name: Sign and notarize macOS installers
        if: matrix.platform == 'mac' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.version.outputs.mac-mode == 'signed'
        working-directory: apps/desktop
        env:
          ARCH: ${{ matrix.arch }}
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.DESKTOP_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.DESKTOP_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
        run: |
          for key in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!key}" ]; then echo "Missing signing credential: $key"; exit 1; fi
          done
          pnpm build
          pnpm --filter @bike4mind/scripts curated:check-build out --expect-url "$CURATED_PUBLIC_URL" --also-scan ../../b4m-core/local-models/dist
          node scripts/sign-update-manifests.mjs check-build out
          pnpm exec electron-builder --mac dmg zip "--$ARCH" --publish never -c.publish.provider=generic "-c.publish.url=$B4M_UPDATE_FEED_URL" -c.forceCodeSigning=true -c.mac.notarize=true "-c.extraMetadata.version=$DESKTOP_VERSION"
          app_dir=release/mac
          if [ "$ARCH" = arm64 ]; then app_dir=release/mac-arm64; fi
          codesign --verify --deep --strict "$app_dir/Bike4Mind.app"
          codesign -d --verbose=4 "$app_dir/Bike4Mind.app" 2>&1 | tee signing.txt
          grep -q '^Authority=Developer ID Application:' signing.txt
          xcrun stapler validate "$app_dir/Bike4Mind.app"
          xcrun stapler validate "release/Bike4Mind-$DESKTOP_VERSION-$ARCH.dmg"
      # One stable certificate gives every build the same designated requirement, which is what lets
      # Squirrel.Mac accept the next build. The keychain is a file codesign is pointed at directly:
      # it is never added to the search list and nothing is marked trusted.
      - name: Sign macOS installers with the self-signed certificate
        if: matrix.platform == 'mac' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.version.outputs.mac-mode == 'selfsigned'
        working-directory: apps/desktop
        env:
          ARCH: ${{ matrix.arch }}
          SELFSIGNED_P12: ${{ secrets.DESKTOP_MAC_SELFSIGNED_P12 }}
          SELFSIGNED_P12_PASSWORD: ${{ secrets.DESKTOP_MAC_SELFSIGNED_P12_PASSWORD }}
          SELFSIGNED_CERT_SHA1: ${{ vars.DESKTOP_MAC_SELFSIGNED_CERT_SHA1 }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          for key in SELFSIGNED_P12 SELFSIGNED_P12_PASSWORD SELFSIGNED_CERT_SHA1; do
            if [ -z "${!key}" ]; then echo "Missing self-signed signing configuration: $key"; exit 1; fi
          done
          sha1=$(tr 'A-F' 'a-f' <<< "$SELFSIGNED_CERT_SHA1")
          if ! [[ "$sha1" =~ ^[0-9a-f]{40}$ ]]; then echo 'DESKTOP_MAC_SELFSIGNED_CERT_SHA1 must be a 40-character SHA-1'; exit 1; fi
          keychain="$RUNNER_TEMP/desktop-selfsigned.keychain-db"
          p12="$RUNNER_TEMP/desktop-selfsigned.p12"
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          (umask 077 && base64 --decode <<< "$SELFSIGNED_P12" > "$p12")
          security import "$p12" -k "$keychain" -f pkcs12 -P "$SELFSIGNED_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          pnpm build
          pnpm --filter @bike4mind/scripts curated:check-build out --expect-url "$CURATED_PUBLIC_URL" --also-scan ../../b4m-core/local-models/dist
          B4M_MAC_SIGN_KEYCHAIN="$keychain" B4M_MAC_SIGN_IDENTITY="$sha1" pnpm exec electron-builder --mac dmg zip "--$ARCH" --publish never -c.mac.identity=- -c.mac.sign=./scripts/sign-mac-selfsigned.cjs -c.forceCodeSigning=true -c.publish.provider=generic "-c.publish.url=$B4M_UPDATE_FEED_URL" "-c.extraMetadata.version=$DESKTOP_VERSION"
          app_dir=release/mac
          if [ "$ARCH" = arm64 ]; then app_dir=release/mac-arm64; fi
          requirement=$(codesign -d -r- "$app_dir/Bike4Mind.app")
          expected="designated => identifier \"com.bike4mind.desktop\" and certificate leaf = H\"$sha1\""
          if [ "$requirement" != "$expected" ]; then echo "Unexpected designated requirement: $requirement"; exit 1; fi
          node scripts/check-mac-signature.mjs "$app_dir/Bike4Mind.app" com.bike4mind.desktop "$sha1"
      - name: Remove the self-signed signing keychain
        if: always() && matrix.platform == 'mac' && needs.version.outputs.mac-mode == 'selfsigned'
        run: |
          security delete-keychain "$RUNNER_TEMP/desktop-selfsigned.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/desktop-selfsigned.keychain-db" "$RUNNER_TEMP/desktop-selfsigned.p12"
      - name: Compare Linux builder metadata with embedded blockmap
        if: matrix.platform == 'linux'
        env:
          DESKTOP_RELEASE_REPOSITORY: ${{ vars.DESKTOP_RELEASE_REPOSITORY }}
        run: python3 apps/desktop/scripts/distribution.py verify-linux apps/desktop/release
      - name: Install Linux smoke test runtime
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm1 libasound2t64
      - name: Launch packaged Linux AppImage
        if: matrix.platform == 'linux'
        timeout-minutes: 3
        run: xvfb-run -a node apps/desktop/scripts/smoke-packaged.mjs
      - name: Install and launch packaged macOS DMG
        if: matrix.platform == 'mac'
        timeout-minutes: 3
        env:
          EXPECT_UPDATES_DISABLED: ${{ needs.version.outputs.mac-mode == 'adhoc' }}
          EXPECT_UPDATES_ENABLED: ${{ needs.version.outputs.mac-mode == 'selfsigned' }}
        run: |
          install_dir=$(mktemp -d)
          mount_dir="$install_dir/mount"
          mkdir -p "$mount_dir"
          trap 'hdiutil detach "$mount_dir" -quiet || true; rm -rf "$install_dir"' EXIT
          arch=$(node -p 'process.arch')
          hdiutil attach "apps/desktop/release/Bike4Mind-$DESKTOP_VERSION-$arch.dmg" -readonly -nobrowse -mountpoint "$mount_dir"
          ditto "$mount_dir/Bike4Mind.app" "$install_dir/Bike4Mind.app"
          hdiutil detach "$mount_dir" -quiet
          node apps/desktop/scripts/smoke-packaged.mjs "$install_dir/Bike4Mind.app/Contents/MacOS/Bike4Mind"
      - name: Install and launch packaged Windows installer
        if: matrix.platform == 'win'
        timeout-minutes: 5
        shell: pwsh
        env:
          EXPECT_UPDATES_ENABLED: 'true'
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'bike4mind-install'
          $installer = "apps/desktop/release/Bike4Mind-$env:DESKTOP_VERSION-setup.exe"
          if (-not (Test-Path $installer)) { throw "Missing installer: $installer" }
          $process = Start-Process -FilePath (Resolve-Path $installer) -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $exe = Join-Path $installDir 'Bike4Mind.exe'
          if (-not (Test-Path $exe)) { throw "Installer did not place $exe" }
          node apps/desktop/scripts/smoke-packaged.mjs $exe
          if ($LASTEXITCODE -ne 0) { throw "Packaged Windows startup check failed" }
      - name: Upload packaged startup evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}-smoke-results
          path: apps/desktop/smoke-results/
          retention-days: 3
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap

  validate:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          merge-multiple: true
          path: installers
      - name: Validate and checksum installers
        env:
          DESKTOP_VERSION: ${{ needs.version.outputs.version }}
          DESKTOP_RELEASE_REPOSITORY: ${{ vars.DESKTOP_RELEASE_REPOSITORY }}
          MAC_RELEASE_MODE: ${{ needs.version.outputs.mac-mode }}
        run: |
          cp apps/desktop/install.sh installers/install.sh
          python3 apps/desktop/scripts/distribution.py installers
      - uses: actions/upload-artifact@v6
        with:
          name: installer-checksums
          path: |
            installers/SHA256SUMS.txt
            installers/latest-*.yml
            installers/latest.yml
            installers/install.sh
          if-no-files-found: error
          retention-days: 1

  # The signing key lives only in this job's environment. While DESKTOP_UPDATE_PUBLIC_KEYS is unset
  # this job is skipped and publish releases the manifests without signatures.
  sign:
    if: vars.DESKTOP_UPDATE_PUBLIC_KEYS != '' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: desktop-update-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          name: installer-checksums
          path: manifests
      - name: Sign update manifests
        env:
          DESKTOP_UPDATE_SIGNING_KEY: ${{ secrets.DESKTOP_UPDATE_SIGNING_KEY }}
          DESKTOP_UPDATE_PUBLIC_KEYS: ${{ vars.DESKTOP_UPDATE_PUBLIC_KEYS }}
        run: node apps/desktop/scripts/sign-update-manifests.mjs sign manifests
      - uses: actions/upload-artifact@v6
        with:
          name: update-manifest-signatures
          path: manifests/*.yml.sig
          if-no-files-found: error
          retention-days: 1

  publish:
    # A skipped sign is accepted only while no update keys are configured; with keys, publish needs its signatures.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.validate.result == 'success'
      && (needs.sign.result == 'success' || (needs.sign.result == 'skipped' && vars.DESKTOP_UPDATE_PUBLIC_KEYS == '')) }}
    needs: [version, validate, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          merge-multiple: true
          path: installers
      - uses: actions/download-artifact@v7
        with:
          name: installer-checksums
          path: installers
      - uses: actions/download-artifact@v7
        if: vars.DESKTOP_UPDATE_PUBLIC_KEYS != ''
        with:
          name: update-manifest-signatures
          path: installers
      - uses: actions/setup-node@v6
        if: vars.DESKTOP_UPDATE_PUBLIC_KEYS != ''
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify update manifest signatures
        if: vars.DESKTOP_UPDATE_PUBLIC_KEYS != ''
        env:
          DESKTOP_UPDATE_PUBLIC_KEYS: ${{ vars.DESKTOP_UPDATE_PUBLIC_KEYS }}
        run: node apps/desktop/scripts/sign-update-manifests.mjs verify installers
      - uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: notes
      - name: Generate release App token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Generate distribution App token
        id: distribution-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DESKTOP_RELEASE_APP_ID }}
          private-key: ${{ secrets.DESKTOP_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ needs.version.outputs.repository-name }}
          permission-contents: write
      # Fail before reserving a protected source tag that a later failure would strand.
      - name: Check distribution destination
        env:
          DESKTOP_VERSION: ${{ needs.validate.outputs.version }}
          SIGNING: ${{ vars.DESKTOP_MAC_SIGNING }}
          SELFSIGNED_BETA: ${{ vars.DESKTOP_MAC_SELFSIGNED_BETA }}
          ADHOC_BETA: ${{ vars.DESKTOP_MAC_ADHOC_BETA }}
          GH_TOKEN: ${{ steps.distribution-token.outputs.token }}
          EXPECTED_MAC_MODE: ${{ needs.version.outputs.mac-mode }}
          GH_REPO: ${{ vars.DESKTOP_RELEASE_REPOSITORY }}
          DISTRIBUTION_REPOSITORY_NAME: ${{ needs.version.outputs.repository-name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo 'Release App token is required.'; exit 1; fi
          test "$GH_REPO" = "$GITHUB_REPOSITORY_OWNER/$DISTRIBUTION_REPOSITORY_NAME"
          python3 apps/desktop/scripts/mac_release_policy.py
          test "$(gh api "repos/$GH_REPO" --jq .private)" = false
      # A failed publish left this version reserved on an older commit; replace it with this one.
      - name: Discard orphaned distribution draft
        if: needs.version.outputs.reclaim != ''
        env:
          DESKTOP_VERSION: ${{ needs.validate.outputs.version }}
          GH_TOKEN: ${{ steps.distribution-token.outputs.token }}
          GH_REPO: ${{ vars.DESKTOP_RELEASE_REPOSITORY }}
        run: python3 apps/desktop/scripts/discard-orphaned-draft.py
      - name: Reserve protected source version tag
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          DESKTOP_VERSION: ${{ needs.validate.outputs.version }}
          RECLAIM_SHA: ${{ needs.version.outputs.reclaim }}
        run: python3 apps/desktop/scripts/reserve-source-tag.py
      - name: Publish desktop release
        env:
          DESKTOP_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TARGET: main
          MAC_RELEASE_MODE: ${{ needs.version.outputs.mac-mode }}
          GH_TOKEN: ${{ steps.distribution-token.outputs.token }}
          GH_REPO: ${{ vars.DESKTOP_RELEASE_REPOSITORY }}
        run: |
          printf '\nSource: https://github.com/%s/commit/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> notes/desktop-release-notes.md
          if [ "$MAC_RELEASE_MODE" = adhoc ]; then
            printf '\nmacOS beta: ad-hoc signed, not Developer ID signed or notarized. The install command above avoids the Gatekeeper prompt; a browser-downloaded dmg needs Privacy & Security > Open Anyway. macOS in-app updates are disabled in this build; rerun the install command to update. Linux updates are unchanged.\n' >> notes/desktop-release-notes.md
          elif [ "$MAC_RELEASE_MODE" = selfsigned ]; then
            printf '\nmacOS beta: signed with a self-signed certificate, not Developer ID signed or notarized. The install command above is the way to install it; a browser-downloaded dmg needs Privacy & Security > Open Anyway. macOS in-app updates are enabled from this build onward; an earlier ad-hoc build needs the install command once to reach it.\n' >> notes/desktop-release-notes.md
          else
            printf '\nmacOS Developer ID signing and notarization enabled.\n' >> notes/desktop-release-notes.md
          fi
          python3 apps/desktop/scripts/distribution.py prune installers
          (cd installers && sha256sum --check SHA256SUMS.txt)
          bash apps/desktop/scripts/publish-release.sh installers notes/desktop-release-notes.md
          printf 'Desktop release: https://github.com/%s/releases/tag/desktop-v%s\n' "$GH_REPO" "$DESKTOP_VERSION" >> "$GITHUB_STEP_SUMMARY"
