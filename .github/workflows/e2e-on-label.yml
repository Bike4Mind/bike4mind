name: E2E Tests (preview rerun)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number with a verifiable deployed preview'
        type: string
        required: true

jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            if (!/^[1-9][0-9]*$/.test(process.env.PR_NUMBER)) throw new Error('Invalid PR number');
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'e2e-core.yml', ref: 'main',
              inputs: { pr_number: process.env.PR_NUMBER },
            });
