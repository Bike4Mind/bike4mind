name: E2E Tests (on label)

on:
  pull_request:
    types: [labeled]

jobs:
  preview:
    if: contains(fromJSON('["run-e2e", "e2e:full"]'), github.event.label.name) && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      id-token: write
    uses: ./.github/workflows/e2e-core.yml
    secrets: inherit
    with:
      pr_number: ${{ format('{0}', github.event.number) }}
