name: E2E Run (reusable)

# Reusable workflow: the single home for the shared E2E plumbing (setup, tested-SHA
# resolution, deploy-in-flight wait, /api/ping health gate, results parser, commit
# status, Slack). Called by e2e-core.yml (posts e2e/core, the prod-promotion gate)
# and e2e-manual.yml (posts e2e/smoke + the nightly full suite). Everything that
# differs between the two is an input below; everything else is identical by design.
# No `secrets:` block here — both callers pass `secrets: inherit`, so this workflow
# references org/repo secrets directly.

on:
  workflow_call:
    inputs:
      stage:              { type: string,  required: false, default: 'dev' }
      pr_number:          { type: string,  required: false, default: '' }
      preview_head_sha:   { type: string, required: false, default: '' }
      preview_deploy_id:  { type: string, required: false, default: '' }
      pr_eligible_only:   { type: boolean, required: false, default: false }
      e2e_test_id:        { type: string,  required: false, default: '' }
      gate_run:           { type: string,  required: false, default: 'false' }
      playwright_args:    { type: string,  required: true }
      status_context:     { type: string,  required: true }
      suite_name:         { type: string,  required: false, default: '' }
      artifact_suffix:    { type: string,  required: false, default: '' }
      timeout_minutes:    { type: number,  required: false, default: 35 }
      # Playwright's globalTimeout in minutes; keep it below timeout_minutes so teardown can run.
      global_timeout_minutes: { type: number, required: false, default: 30 }
      execution_timeout_minutes: { type: number, required: false, default: 32 }
      stamp_promotable:   { type: boolean, required: true }
      wait_for_deploy:    { type: boolean, required: false, default: false }
      show_credits:       { type: boolean, required: false, default: false }
      trigger_label:      { type: string,  required: true }
      concurrency_group:  { type: string,  required: true }
      cancel_in_progress: { type: boolean, required: false, default: false }
    outputs:
      outcome:
        description: 'Actual E2E execution outcome (passed, failed, skipped, cancelled, setup_failed, no_tests, incomplete, not_run)'
        value: ${{ jobs.e2e-run.outputs.outcome }}

env:
  AWS_REGION: us-east-2
  NODE_VERSION: '24'

jobs:
  e2e-run:
    runs-on: ${{ vars.RUNNER_LABEL_MEDIUM || 'ubuntu-latest-m' }}
    name: ${{ inputs.suite_name && format('E2E {0} Tests', inputs.suite_name) || 'E2E Tests' }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      outcome: ${{ steps.results.outputs.outcome }}
    permissions:
      contents: read
      pull-requests: read
      id-token: write
      statuses: write
    concurrency:
      group: ${{ inputs.concurrency_group }}
      cancel-in-progress: ${{ inputs.cancel_in_progress }}
    steps:
      - name: Resolve configuration
        id: config
        env:
          # Pass dispatch inputs through env (never interpolate attacker-
          # influenceable values straight into the shell). pr_number flows into
          # the SST stage and `sst shell --stage`, so it must be digits-only.
          PR_NUMBER: ${{ inputs.pr_number }}
          STAGE_INPUT: ${{ inputs.stage }}
          PREVIEW_SERVER_DOMAIN: ${{ vars.PREVIEW_SERVER_DOMAIN }}
          STAGING_SERVER_DOMAIN: ${{ vars.STAGING_SERVER_DOMAIN }}
          TRUSTED_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.preview_deploy_id != '' && inputs.preview_head_sha != '' }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            if [ "$TRUSTED_PREVIEW" != "true" ]; then
              echo "::error::Preview execution requires a trusted main dispatch and verified deployment evidence"
              exit 1
            fi
            if ! printf '%s' "$PR_NUMBER" | grep -qE '^[0-9]+$'; then
              echo "::error::pr_number must be digits-only; got '$PR_NUMBER'"
              exit 1
            fi
            STAGE="pr${PR_NUMBER}"
            API_URL="https://app.pr${PR_NUMBER}.${PREVIEW_SERVER_DOMAIN}"
            ENV_LABEL="preview-${PR_NUMBER}"
          else
            STAGE="${STAGE_INPUT:-dev}"
            API_URL="https://app.${STAGING_SERVER_DOMAIN}"
            ENV_LABEL="Staging"
          fi
          echo "stage=$STAGE" >> $GITHUB_OUTPUT
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "env_label=$ENV_LABEL" >> $GITHUB_OUTPUT
          echo "Stage: $STAGE"
          echo "API URL: $API_URL"

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: false
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted checkout
        if: inputs.preview_head_sha != ''
        env:
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pnpm-store
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --recursive

      - name: Build core packages
        run: pnpm core:build

      - name: Configure AWS credentials
        if: inputs.pr_number == ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEV_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Capture the SHA currently live on staging BEFORE the suite runs, so a mid-
      # run staging redeploy can't mislabel it. Source of truth = the newest main
      # commit whose `staging/deploy` status is success (the same signal the
      # console's staging gate reads) - resolved via GITHUB_TOKEN, no AWS/SSM.
      # Only the full-suite dev/staging run stamps the promotable frontier (P0-2):
      # skip previews and scoped single-project dispatches. Best-effort by design.
      - name: Resolve tested SHA for e2e status
        id: tested_sha
        if: ${{ inputs.stamp_promotable }}
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          STATUS_CONTEXT: ${{ inputs.status_context }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = 'Bike4Mind', repo = 'bike4mind';
            const { data: commits } = await github.rest.repos.listCommits({ owner, repo, sha: 'main', per_page: 20 });
            for (const c of commits) {
              const { data: st } = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: c.sha });
              if (st.statuses.some(s => s.context === 'staging/deploy' && s.state === 'success')) {
                core.setOutput('sha', c.sha);
                core.info(`Tested staging SHA = ${c.sha} (newest with staging/deploy=success)`);
                return;
              }
            }
            core.warning(`No recent main commit has staging/deploy=success; ${process.env.STATUS_CONTEXT} status will be skipped.`);

      - name: Install Playwright Chromium
        timeout-minutes: 12
        uses: ./.github/actions/install-playwright-chromium

      # A staging deploy in flight swaps the Lambda under the suite, so requests can
      # 401 or 5xx mid-run. When that hits the create-test-user setup it skips the
      # ENTIRE suite via Playwright's setup-dependency graph (one red, the rest
      # "did not run"). E2E_CLEANUP_SECRET itself is stable across deploys (the
      # deployer re-seeds the same per-tier value), so the secret is not the hazard -
      # the swap is.
      # /api/ping is not enough: CloudFront answers it green all
      # through a deploy. So gate on the `staging/deploy` commit status: if the
      # newest commit that has one is still `pending`, a deploy is running - wait it
      # out. dev/staging only (a preview has its own env). Best-effort: warns +
      # proceeds on timeout so a stuck status can't hang the job forever.
      - name: Wait for staging deploy to settle (no deploy in flight)
        # Decoupled from stamp_promotable: every dev/staging run (any scoped manual
        # dispatch too) should wait out an in-flight deploy, but only the promotable
        # frontier stamps a status. Callers pass `pr_number == ''` to restore the
        # original per-file wait semantics.
        if: ${{ inputs.wait_for_deploy }}
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = 'Bike4Mind', repo = 'bike4mind';
            const deployInFlight = async () => {
              const { data: commits } = await github.rest.repos.listCommits({ owner, repo, sha: 'main', per_page: 10 });
              for (const c of commits) {
                const { data: st } = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: c.sha });
                const s = st.statuses.find(x => x.context === 'staging/deploy');
                if (!s) continue;              // no status on this commit yet; check older
                return s.state === 'pending';  // the newest commit WITH a status decides
              }
              return false;
            };
            for (let i = 0; i < 30; i++) {     // up to ~10 min
              if (!(await deployInFlight())) { core.info('No staging deploy in flight; proceeding.'); return; }
              core.info(`Staging deploy in progress; waiting 20s (attempt ${i + 1}/30)...`);
              await new Promise(r => setTimeout(r, 20000));
            }
            core.warning('Staging still deploying after ~10 min; proceeding anyway (the health probe below is the backstop).');

      - name: Wait for deployment to be healthy
        env:
          # Probe /api/ping (a real Lambda route) rather than the bare origin:
          # CloudFront can answer the apex with 200/302 before the function is
          # warm, so a bare-origin check passes against a not-yet-ready deploy.
          TARGET_URL: ${{ steps.config.outputs.api_url }}/api/ping
        run: |
          echo "Waiting for $TARGET_URL to be healthy..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Deployment is healthy (HTTP $STATUS) after $((i * 10))s"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "Deployment did not become healthy within 300s"
          exit 1

      - name: Verify immutable preview readiness before testing
        if: inputs.pr_number != '' && inputs.preview_deploy_id != ''
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.preview_head_sha }}
          DEPLOY_ID: ${{ inputs.preview_deploy_id }}
        with:
          script: |
            await require('./.github/scripts/preview-e2e.cjs').verify({ github, context });

      # Weekend-scaled previews run zero tasks; wake one before the suite instead of letting
      # every test time out. Its own budget, outside execution_timeout_minutes.
      - name: Wake a sleeping preview before testing
        if: inputs.pr_number != '' && inputs.preview_deploy_id != ''
        timeout-minutes: 10
        env:
          API_URL: ${{ steps.config.outputs.api_url }}
          E2E_PREVIEW_SEED: ${{ secrets.E2E_CLEANUP_SECRET_PREVIEW }}
          E2E_WAF_BYPASS_TOKEN: ${{ secrets.E2E_WAF_BYPASS_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SST_STAGE: ${{ steps.config.outputs.stage }}
        run: |
          . .github/scripts/derive-preview-e2e-secret.sh "$SST_STAGE"
          node .github/scripts/preview-e2e.cjs

      - name: Resolve E2E test ID
        id: testid
        env:
          E2E_TEST_ID_INPUT: ${{ inputs.e2e_test_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # NEVER let this be empty. An empty E2E_TEST_ID makes global-setup fall back to the
          # unscoped sweep, which hard-deletes every -<digits>-e2e@test.com user on the target
          # stage - including the live users of any suite running concurrently against it, which
          # then 401s and dies mid-test with unrelated-looking timeouts.
          # See apps/client/e2e/global-setup.ts + pages/api/test/cleanup.ts.

          # Same alphanumeric strip the TS side applies (e2e/helpers/test-users.ts
          # getE2ETestId); also stops a dispatch value smuggling a newline into GITHUB_OUTPUT.
          SAFE_INPUT=$(printf '%s' "$E2E_TEST_ID_INPUT" | tr -cd 'a-zA-Z0-9')

          # Unique per Actions run and traceable straight back to it. A re-run reuses the id
          # deliberately, so its pre-run cleanup collects its own earlier attempt's leftovers.
          TEST_ID="gh${RUN_ID}"
          if [ -n "$SAFE_INPUT" ]; then
            TEST_ID="${SAFE_INPUT}-${TEST_ID}"
          fi
          echo "test_id=$TEST_ID" >> "$GITHUB_OUTPUT"
          echo "Scoping e2e users and cleanup to testId=$TEST_ID"

      - name: Run E2E tests
        id: e2e
        timeout-minutes: ${{ inputs.execution_timeout_minutes }}
        env:
          API_URL: ${{ steps.config.outputs.api_url }}
          # dev/staging read E2E_CLEANUP_SECRET from SST via the `sst shell` wrapper
          # below (same-account). Preview stacks live in a SEPARATE AWS account the
          # dev role can't `sst shell` into, so for pr<N> runs we inject the secret
          # per-stage from this seed secret instead. It must match what the deployer sets on
          # each preview stage.
          # Empty for dev/staging: the suite prefers the env var over SST, so the preview
          # value must never reach a staging run.
          # E2E_CLEANUP_SECRET is the ONLY SST value the suite needs.
          E2E_PREVIEW_SEED: ${{ inputs.pr_number != '' && secrets.E2E_CLEANUP_SECRET_PREVIEW || '' }}
          E2E_WAF_BYPASS_TOKEN: ${{ secrets.E2E_WAF_BYPASS_TOKEN }}
          E2E_TEST_ID: ${{ steps.testid.outputs.test_id }}
          # Only wire the credits webhook for suites that report credits (show_credits).
          # Core runs the notebook project too, but must NOT post the in-process AI
          # Credits report (global-teardown -> notifyCreditsReport) to the slow-responses
          # channel on every deploy gate — leaving this empty short-circuits that post,
          # matching the pre-extraction Core behavior.
          SLACK_WEBHOOK_URL_SLOW_RESPONSES: ${{ inputs.show_credits && secrets.SLACK_WEBHOOK_URL_SLOW_RESPONSES || '' }}
          AI_LATENCY_RUN: 'false'
          PW_WORKERS: '3'
          PW_GLOBAL_TIMEOUT_MINUTES: ${{ inputs.global_timeout_minutes }}
          CI: 'true'
          PLAYWRIGHT_ARGS: ${{ inputs.playwright_args }}
          PR_E2E: ${{ inputs.pr_eligible_only && 'true' || 'false' }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SST_STAGE: ${{ steps.config.outputs.stage }}
        run: |
          set -o pipefail
          [ -n "$PLAYWRIGHT_ARGS" ] && echo "Running: playwright test $PLAYWRIGHT_ARGS" || echo "Running full suite"
          if [ -n "$PR_NUMBER" ]; then
            # Preview (cross-account): E2E_CLEANUP_SECRET is derived from the seed above.
            . .github/scripts/derive-preview-e2e-secret.sh "$SST_STAGE"
            # A missing preview seed is an explicit skip, not evidence of passing tests.
            if [ -z "${E2E_CLEANUP_SECRET:-}" ]; then
              echo "::warning::preview e2e unavailable: E2E_CLEANUP_SECRET_PREVIEW repo secret is not configured; skipping (0 tests run)"
              echo "preview_skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            pnpm --filter client exec playwright test $PLAYWRIGHT_ARGS 2>&1 | tee apps/client/playwright-output.txt
          else
            # dev/staging (same account): resolve the secret from SST.
            pnpm sst shell --stage "$SST_STAGE" -- pnpm --filter client exec playwright test $PLAYWRIGHT_ARGS 2>&1 | tee apps/client/playwright-output.txt
          fi

      - name: Scrub E2E secrets from test output
        id: scrub
        if: always() && steps.e2e.outputs.preview_skipped != 'true'
        env:
          E2E_WAF_BYPASS_TOKEN: ${{ secrets.E2E_WAF_BYPASS_TOKEN }}
          E2E_CLEANUP_SECRET: ${{ secrets.E2E_CLEANUP_SECRET }}
          E2E_PREVIEW_SEED: ${{ startsWith(steps.config.outputs.stage, 'pr') && secrets.E2E_CLEANUP_SECRET_PREVIEW || '' }}
          STAGE: ${{ steps.config.outputs.stage }}
        # A preview run sent its derived value, not the staging secret, so scrub that one.
        run: |
          case "$STAGE" in pr[0-9]*) . .github/scripts/derive-preview-e2e-secret.sh "$STAGE" ;; esac
          python3 scripts/scrub-e2e-token.py apps/client/playwright-report apps/client/e2e/test-results apps/client/pw-results.json

      - name: Upload Playwright report
        # Nothing to upload on a skip; without this the upload emits a "No files were
        # found" warning that reads like the run lost its report.
        # Private repositories only: an artifact is readable by everyone who can read the repo.
        # Elsewhere the report is reached through the QA ingest below.
        if: always() && steps.e2e.outputs.preview_skipped != 'true' && steps.scrub.outcome == 'success' && github.repository_visibility == 'private'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report${{ inputs.artifact_suffix && format('-{0}', inputs.artifact_suffix) || '' }}-${{ steps.config.outputs.stage }}${{ inputs.e2e_test_id && format('-{0}', inputs.e2e_test_id) || '' }}
          path: |
            apps/client/playwright-report/
            apps/client/pw-results.json
          retention-days: 7

      - name: Parse test results
        id: results
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          E2E_PREVIEW_SKIPPED: ${{ steps.e2e.outputs.preview_skipped }}
          E2E_CANCELLED: ${{ job.status == 'cancelled' }}
          E2E_JOB_STATUS: ${{ job.status }}
          E2E_SUITE_NAME: ${{ inputs.suite_name }}
        run: node scripts/e2e-outcome.mjs

      # Shadow mode: stores the run for /status; the Slack post below still runs.
      # Best-effort by design: scripts/qa-report.mjs exits 0 on every failure. Skipped
      # on the same two states Notify Slack treats specially: a cancelled (superseded)
      # run would store zeros as an infra error, and a preview skip ran nothing.
      - name: Ingest QA run (shadow)
        if: ${{ !cancelled() && steps.e2e.outputs.preview_skipped != 'true' && steps.scrub.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          QA_INGEST_URL: ${{ vars.QA_INGEST_URL }}
          QA_INGEST_KEY: ${{ secrets.QA_INGEST_KEY }}
          QA_PRODUCT: ${{ vars.QA_PRODUCT }}
          QA_SUITE: ${{ inputs.suite_name || 'Full' }}
          QA_ENV: ${{ steps.config.outputs.env_label }}
          QA_BRANCH: ${{ inputs.pr_number && format('pr-{0}', inputs.pr_number) || github.ref_name }}
          QA_TRIGGER: ${{ inputs.trigger_label }}
          QA_SHA: ${{ inputs.preview_head_sha || steps.tested_sha.outputs.sha || github.sha }}
          SHOW_CREDITS: ${{ inputs.show_credits }}
        run: |
          args=(--results apps/client/pw-results.json --report-dir apps/client/playwright-report --counts-out qa-counts.json)
          # Same gate as the AI Credits Slack block: notebook.spec.ts writes credits.json on every suite.
          if [ "$SHOW_CREDITS" = "true" ]; then
            args+=(--credits apps/client/e2e/fixtures/credits.json)
          fi
          node scripts/qa-report.mjs "${args[@]}"

      # The legacy QA ingest still uses spec-level accounting; compare during migration.
      - name: Compare QA counts with the Slack summary (shadow)
        if: ${{ !cancelled() && hashFiles('qa-counts.json') != '' }}
        continue-on-error: true
        env:
          PASSED: ${{ steps.results.outputs.passed }}
          FAILED: ${{ steps.results.outputs.failed }}
          SKIPPED: ${{ steps.results.outputs.skipped }}
          NOT_STARTED: ${{ steps.results.outputs.not_started }}
          TOTAL: ${{ steps.results.outputs.total }}
        run: |
          MISMATCH=""
          check() {
            local got
            got=$(jq -r ".$1" qa-counts.json)
            [ "$got" = "$2" ] || MISMATCH="$MISMATCH $1(script=$got slack=$2)"
          }
          check passed "$PASSED"
          check failed "$FAILED"
          check skipped "$SKIPPED"
          check notStarted "$NOT_STARTED"
          check total "$TOTAL"
          if [ -n "$MISMATCH" ]; then
            echo "::warning::QA shadow counts differ from the Slack summary:$MISMATCH"
            echo "QA shadow counts MISMATCH:$MISMATCH" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "QA shadow counts match the Slack summary" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post e2e commit status
        # Nonrequired status; errors must replace any stale success on the tested SHA.
        if: always() && inputs.stamp_promotable && steps.tested_sha.outputs.sha != ''
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          TESTED_SHA: ${{ steps.tested_sha.outputs.sha }}
          E2E_STATE: ${{ steps.results.outputs.state }}
          E2E_LABEL: ${{ steps.results.outputs.label }}
          E2E_CANCELLED: ${{ job.status == 'cancelled' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS_CONTEXT: ${{ inputs.status_context }}
          SUITE_NAME: ${{ inputs.suite_name }}
        with:
          github-token: ${{ github.token }}
          script: |
            const sha = process.env.TESTED_SHA;
            const cancelled = process.env.E2E_CANCELLED === 'true';
            const state = cancelled ? 'error' : process.env.E2E_STATE || 'error';
            const desc = `E2E: ${cancelled ? 'Cancelled' : process.env.E2E_LABEL || 'Setup/deployment failed'}`;
            await github.rest.repos.createCommitStatus({
              owner: 'Bike4Mind', repo: 'bike4mind', sha,
              state, context: process.env.STATUS_CONTEXT, target_url: process.env.RUN_URL, description: desc,
            });
            core.info(`Posted ${process.env.STATUS_CONTEXT}=${state} on ${sha.slice(0, 7)}`);

      - name: Parse credits
        id: credits
        if: always() && inputs.show_credits
        run: |
          CREDITS_FILE="apps/client/e2e/fixtures/credits.json"
          if [ ! -f "$CREDITS_FILE" ]; then
            CREDITS_LINES="_No credits data available_"
          else
            # Must stay in sync with CREDITS_THRESHOLD in apps/client/e2e/helpers/slack.ts
            # and scripts/qa-report.mjs.
            CREDITS_THRESHOLD=60
            CREDITS_LINES=$(jq -r --argjson threshold "$CREDITS_THRESHOLD" '[.[] |
              (.avgCredits == null) as $missing |
              (.avgCredits != null and .avgCredits > $threshold) as $exceeded |
              "• " + .model + " — credits: " + ((.avgCredits // "Credit Used data unavailable (chip missing or prior failure).") | tostring) + " " + (if $missing then ":x:" elif $exceeded then ":x: _(exceeds threshold of \($threshold))_" else ":white_check_mark:" end)
            ] | join("\\n")' "$CREDITS_FILE")
          fi
          # Emit the AI Credits Slack block as a JSON fragment with a leading comma so it
          # slots into the blocks array between the summary and actions blocks.
          echo "credits_block=,{\"type\":\"section\",\"text\":{\"type\":\"mrkdwn\",\"text\":\"*💳 AI Credits*\\n${CREDITS_LINES}\"}}" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        # Superseded runs stay quiet in Slack; their workflow/status records cancellation.
        if: ${{ !cancelled() }}
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2
        with:
          webhook: ${{ secrets.SLACK_E2E_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Playwright E2E${{ inputs.suite_name && format(' {0}', inputs.suite_name) || ' Tests' }} (${{ inputs.trigger_label }}) - ${{ steps.results.outputs.label || 'Setup/deployment failed' }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Playwright E2E${{ inputs.suite_name && format(' {0}', inputs.suite_name) || ' Tests' }} (${{ inputs.trigger_label }})"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status*\n${{ steps.results.outputs.slack_status || ':x: Setup/deployment failed' }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch*\n`${{ github.ref_name }}`"
                    }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Environment*\n<${{ steps.config.outputs.api_url }}|${{ steps.config.outputs.env_label }}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Results*\n${{ steps.results.outputs.slack_results || 'No test results available' }}"
                    }
                  ]
                }${{ steps.results.outputs.slack_spec_blocks }}${{ steps.credits.outputs.credits_block }},
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "${{ steps.e2e.outputs.preview_skipped != 'true' && github.repository_visibility == 'private' && 'View Report' || 'View Run' }}" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}${{ steps.e2e.outputs.preview_skipped != 'true' && github.repository_visibility == 'private' && '#artifacts' || '' }}"
                    }
                  ]
                }
              ]
            }

      # Same run, posted to production's /status too. Last in the job on purpose: a slow or
      # hung prod must not hold up the Slack post or the promotion stamp above. No --counts-out:
      # the Slack comparison reads the staging ingest's counts.
      - name: Ingest QA run to production
        if: ${{ !cancelled() && steps.e2e.outputs.preview_skipped != 'true' && steps.scrub.outcome == 'success' && vars.QA_INGEST_URL_PROD != '' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          QA_INGEST_URL: ${{ vars.QA_INGEST_URL_PROD }}
          QA_INGEST_KEY: ${{ secrets.QA_INGEST_KEY_PROD }}
          QA_PRODUCT: ${{ vars.QA_PRODUCT }}
          QA_SUITE: ${{ inputs.suite_name || 'Full' }}
          QA_ENV: ${{ steps.config.outputs.env_label }}
          QA_BRANCH: ${{ inputs.pr_number && format('pr-{0}', inputs.pr_number) || github.ref_name }}
          QA_TRIGGER: ${{ inputs.trigger_label }}
          QA_SHA: ${{ inputs.preview_head_sha || steps.tested_sha.outputs.sha || github.sha }}
          SHOW_CREDITS: ${{ inputs.show_credits }}
        run: |
          args=(--results apps/client/pw-results.json --report-dir apps/client/playwright-report)
          if [ "$SHOW_CREDITS" = "true" ]; then
            args+=(--credits apps/client/e2e/fixtures/credits.json)
          fi
          node scripts/qa-report.mjs "${args[@]}"

      - name: Enforce E2E outcome
        if: ${{ !cancelled() && steps.results.outputs.outcome != 'passed' && steps.results.outputs.outcome != 'skipped' }}
        run: exit 1
