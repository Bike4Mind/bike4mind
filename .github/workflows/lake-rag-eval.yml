name: Lake RAG Eval (staging)

# Runs the live lake retrieval eval (b4m-core/services/src/llm/evals/lakeRag/run.live.test.ts)
# against staging and fails when a banded metric leaves the noise band in that directory's README
# (10 points pass rate, 5 points retrieval rate, 10 points multi-lake drop) relative to the committed baseline.
# The band is two-sided: an out-of-band improvement fails too, and is fixed by re-recording.
#
# The baseline comparison does not check which model produced the baseline, so a gated run takes
# its model FROM the baseline file rather than from an input: the two cannot drift apart.
# A `record_baseline` dispatch skips the gate and uploads the report; commit that file as
# BASELINE_PATH to (re)set the baseline.
#
# Every run posts to Slack, pass or fail, so a week with no post stands out.

on:
  schedule:
    # Mondays 08:00 UTC: two hours clear of another weekly eval that hits staging at 06:00 UTC.
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      record_baseline:
        description: 'Skip the baseline gate and upload the report as a candidate baseline'
        type: boolean
        default: false
      model:
        description: 'Model id for a baseline recording (a gated run uses the model named in the baseline)'
        type: string
        required: false

concurrency:
  group: lake-rag-eval-staging
  cancel-in-progress: false

env:
  BASELINE_PATH: b4m-core/services/src/llm/evals/lakeRag/baseline.staging.json

jobs:
  check-repository:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest-m' }}
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Check repository
        id: check
        env:
          REPOSITORY: ${{ github.repository }}
          CANONICAL_REPO: ${{ vars.CANONICAL_REPO || 'Bike4Mind/bike4mind' }}
        run: |
          if [ "$REPOSITORY" = "$CANONICAL_REPO" ]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
          else
            echo "should-run=false" >> $GITHUB_OUTPUT
            echo "Skipping workflow - not running on the canonical repository"
          fi

  eval:
    needs: check-repository
    if: ${{ needs.check-repository.outputs.should-run == 'true' }}
    runs-on: ${{ vars.RUNNER_LABEL_MEDIUM || 'ubuntu-latest-m' }}
    # A healthy run against staging takes about 12 minutes (16 ingests, 33 questions x 3 arms). The
    # test's own budget (run.live.test.ts TIMEOUT_MS) is far larger, so this is the real cap.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Authenticate with private NPM package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Build core packages
        run: pnpm turbo:core:build

      # Same check as e2e-run.yml's "Wait for staging deploy to settle" (keep in sync): a deploy
      # swaps the Lambda mid-run, which would show up here as failed turns, not as a skip.
      - name: Wait for staging deploy to settle
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = 'Bike4Mind', repo = 'bike4mind';
            const deployInFlight = async () => {
              const { data: commits } = await github.rest.repos.listCommits({ owner, repo, sha: 'main', per_page: 10 });
              for (const c of commits) {
                const { data: st } = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: c.sha });
                const s = st.statuses.find(x => x.context === 'staging/deploy');
                if (!s) continue;
                return s.state === 'pending';
              }
              return false;
            };
            for (let i = 0; i < 30; i++) {
              if (!(await deployInFlight())) { core.info('No staging deploy in flight; proceeding.'); return; }
              core.info(`Staging deploy in progress; waiting 20s (attempt ${i + 1}/30)...`);
              await new Promise(r => setTimeout(r, 20000));
            }
            core.warning('Staging still deploying after ~10 min; proceeding anyway.');

      - name: Resolve model and baseline
        id: resolve
        env:
          RECORD_BASELINE: ${{ inputs.record_baseline }}
          MODEL_INPUT: ${{ inputs.model }}
          MODEL_VAR: ${{ vars.LAKE_RAG_EVAL_MODEL }}
        run: |
          if [ "$RECORD_BASELINE" = "true" ]; then
            MODEL="${MODEL_INPUT:-$MODEL_VAR}"
            if [ -z "$MODEL" ]; then
              echo "::error::A baseline recording needs a model: pass the model input or set the LAKE_RAG_EVAL_MODEL repo variable."
              exit 1
            fi
            echo "baseline=" >> "$GITHUB_OUTPUT"
          else
            if [ ! -f "$BASELINE_PATH" ]; then
              echo "::error::No baseline at $BASELINE_PATH. Dispatch this workflow with record_baseline, then commit the uploaded report there."
              exit 1
            fi
            MODEL=$(jq -r '.model // empty' "$BASELINE_PATH")
            if [ -z "$MODEL" ]; then
              echo "::error::$BASELINE_PATH names no model."
              exit 1
            fi
            echo "baseline=$GITHUB_WORKSPACE/$BASELINE_PATH" >> "$GITHUB_OUTPUT"
          fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "Model: $MODEL"

      - name: Run the live eval against staging
        id: eval
        env:
          LAKE_RAG_EVAL_BASE_URL: https://app.${{ vars.STAGING_SERVER_DOMAIN }}
          LAKE_RAG_EVAL_MODEL: ${{ steps.resolve.outputs.model }}
          LAKE_RAG_EVAL_BASELINE_PATH: ${{ steps.resolve.outputs.baseline }}
          LAKE_RAG_EVAL_REPORT_PATH: ${{ runner.temp }}/lakerag-report.json
          # An API key is preferred when set; otherwise the eval mints and deletes a throwaway user.
          LAKE_RAG_EVAL_API_KEY: ${{ secrets.LAKE_RAG_EVAL_API_KEY }}
          E2E_CLEANUP_SECRET: ${{ secrets.E2E_CLEANUP_SECRET }}
        run: |
          # The suite skips (and passes) when it has no credential, which would read as green.
          if [ -z "$LAKE_RAG_EVAL_API_KEY" ] && [ -z "$E2E_CLEANUP_SECRET" ]; then
            echo "::error::Neither LAKE_RAG_EVAL_API_KEY nor E2E_CLEANUP_SECRET is set; the eval would skip."
            exit 1
          fi
          set -o pipefail
          pnpm --filter @bike4mind/services exec vitest run src/llm/evals/lakeRag/run.live.test.ts 2>&1 \
            | tee "$RUNNER_TEMP/lakerag-output.txt"

      - name: Write job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo '## Lake RAG eval (staging)'
            echo '```'
            OUT=$(sed -n '/^lake RAG eval:/,/^$/p' "$RUNNER_TEMP/lakerag-output.txt" 2>/dev/null)
            echo "${OUT:-No report printed (the run failed before scoring).}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The committable copy drops each turn's questId: scripts/check-no-account-ids.sh rejects
      # database ids in shippable code, and compareLakeRagReports never reads them.
      - name: Write candidate baseline
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$RUNNER_TEMP/lakerag-report.json" ]; then
            jq 'del(.turns[].questId)' "$RUNNER_TEMP/lakerag-report.json" > "$RUNNER_TEMP/baseline.staging.json"
          fi

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: lakerag-report
          path: |
            ${{ runner.temp }}/lakerag-report.json
            ${{ runner.temp }}/baseline.staging.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Summarize for Slack
        id: slack_summary
        if: ${{ always() }}
        run: |
          REPORT="$RUNNER_TEMP/lakerag-report.json"
          if [ -f "$REPORT" ]; then
            # Literal \n separators: the Slack payload is JSON, as in e2e-run.yml's spec_summary.
            SUMMARY=$(jq -r '
              def pct: (.rate * 1000 | round / 10 | tostring) + "%";
              [ .arms | to_entries[]
                | "\(.key): pass \(.value.pass | pct) (\(.value.pass.passed)/\(.value.pass.total)), retrieval \(.value.retrieval | pct)"
              ] | join("\\n")' "$REPORT")
            VERDICT=$(sed -n 's/^  baseline: //p' "$RUNNER_TEMP/lakerag-output.txt" 2>/dev/null | head -n 1)
            if [ -n "$VERDICT" ]; then
              SUMMARY="$SUMMARY\\nBaseline: $VERDICT"
            fi
          else
            SUMMARY='_No report: the run failed before scoring._'
          fi
          # Defensive: every field in SUMMARY is a fixed string or number today; strip quotes so a future free-text field cannot break the payload.
          SUMMARY=$(printf '%s' "$SUMMARY" | tr -d '"')
          echo "text=$SUMMARY" >> "$GITHUB_OUTPUT"

      # always(), not !cancelled() as in e2e-run.yml: nothing here supersedes a run, so a
      # cancel is a timeout or a manual stop, and it should post rather than go quiet.
      - name: Notify Slack
        if: ${{ always() }}
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_E2E_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Lake RAG eval (staging) - ${{ job.status == 'cancelled' && ':x: Cancelled or timed out' || steps.eval.outcome == 'success' && inputs.record_baseline && ':memo: Baseline recorded (gate skipped)' || steps.eval.outcome == 'success' && ':white_check_mark: Passed' || steps.eval.outcome == 'failure' && ':x: Failed' || ':x: Failed before the eval ran' }}",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "Lake RAG eval (staging)" }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status*\n${{ job.status == 'cancelled' && ':x: Cancelled or timed out' || steps.eval.outcome == 'success' && inputs.record_baseline && ':memo: Baseline recorded (gate skipped)' || steps.eval.outcome == 'success' && ':white_check_mark: Passed' || steps.eval.outcome == 'failure' && ':x: Failed' || ':x: Failed before the eval ran' }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Model*\n`${{ steps.resolve.outputs.model || 'unresolved' }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Trigger*\n${{ github.event_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch*\n`${{ github.ref_name }}`"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*Results*\n${{ steps.slack_summary.outputs.text }}" }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
