name: Lambda Bundle Guard

# Runs esbuild over every Lambda handler infra/ declares, so a dependency change
# that breaks the bundle is caught here instead of on a real deploy.
#
# Nothing else in CI does this. `sst build` is not a command (sst 4.17.1), and
# `sst diff` reads the state passphrase out of SSM before it evaluates a single
# resource, so no sst path bundles a handler without AWS credentials and a state
# lock. That left exactly one thing running esbuild over the handlers: a deploy.
# sst-infra-preview-gate.yml forces a preview for infra/ and sst-pin changes, but
# a pnpm-lock.yaml change is a deploy-surface change it does not cover, and
# widening it to the lockfile would put a ~20 minute throwaway preview deploy
# behind every Dependabot PR. This job is the ~2 minute version of that coverage.
#
# scripts/check-lambda-bundle.mjs has the fidelity notes: it replicates sst's
# bundling step rather than calling it, which covers module resolution and
# ESM/CJS linking - the part a dependency change breaks.
#
# Path-filtered, so it is NOT eligible to be a required check: a filtered
# workflow reports nothing on a PR it skips, and a required check that never
# reports hangs the PR pending. Making it required means moving the applicability
# decision inside the job, the way sst-infra-preview-gate.yml does.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Mirrored as a regex list in the `paths` job below, which applies the same filter on
    # merge_group (where `paths:` is not supported). Keep the two in sync.
    paths:
      - '**/package.json'
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      # The EventBridge handlers in apps/workers resolve @server/* through this file's interim
      # paths, so an edit to it can break every one of their bundles.
      - apps/workers/tsconfig.json
      # The guard itself, because nothing else in CI reaches it: root `scripts/`
      # is not a workspace package so `pnpm -r test` skips it, ci.yml runs only
      # `--dir infra` and `--dir scripts/codemods`, and audit-gate.yml filters
      # its own run to `audit-gate`. Without these three, a PR that edits the
      # guard gets no signal from the 16 tests that are the reason to trust it.
      - scripts/check-lambda-bundle.mjs
      - scripts/__tests__/check-lambda-bundle.test.mjs
      - .github/workflows/lambda-bundle-guard.yml
  # Also run on the merge queue so the check reports there if it later becomes a
  # required check. It earns its keep in the queue specifically: two dependency
  # PRs that each bundle fine alone can resolve to a version neither one tested
  # once they are combined, and a push to main auto-deploys staging. A queue entry
  # whose group diff touches none of the paths above skips the bundle job, though;
  # see the `paths` job.
  merge_group:
    branches: [main]

env:
  NODE_VERSION: '24'

concurrency:
  group: lambda-bundle-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # merge_group has no `paths:` filter, so without this every queue entry paid for a second
  # full core build. Diffs the group's base..head (which includes the entries queued ahead of
  # this one, so the combined-lockfile case above is still covered) through the compare API,
  # with no checkout. Fails open: any API error, or a diff at the API's 300-file cap, reports
  # touched=true, and `bundle` treats an empty output the same way.
  paths:
    name: Lambda bundle paths
    if: github.event_name == 'merge_group'
    runs-on: ${{ vars.RUNNER_LABEL_QUEUE || vars.RUNNER_LABEL || 'ubuntu-latest-m' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      touched: ${{ steps.diff.outputs.touched }}
    steps:
      - name: Check the group diff against the pull_request paths
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -uo pipefail
          # Must match `on.pull_request.paths` above. GitHub's `**/package.json` also matches
          # the root package.json, hence the optional `(.*/)?` prefix.
          pattern='^((.*/)?package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|apps/workers/tsconfig\.json|scripts/check-lambda-bundle\.mjs|scripts/__tests__/check-lambda-bundle\.test\.mjs|\.github/workflows/lambda-bundle-guard\.yml)$'
          if ! files=$(gh api "repos/${REPO}/compare/${BASE_SHA}...${HEAD_SHA}" --jq '(.files // [])[].filename'); then
            echo "::warning::Could not list the merge group's changed files; running the bundle guard."
            echo "touched=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(printf '%s\n' "$files" | grep -c . || true)
          if [ "$count" -ge 300 ]; then
            echo "Group diff hit the compare API's 300-file cap; running the bundle guard."
            echo "touched=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$files" | grep -qE "$pattern"; then
            echo "Group diff touches a bundle-guard path."
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "Group diff (${count} files) touches no bundle-guard path; skipping."
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi

  bundle:
    name: Lambda handlers bundle
    needs: paths
    # `paths` is skipped on pull_request (the trigger's own filter already applied), so
    # `!cancelled()` lifts the implicit success() on it. `!= 'false'` keeps the fail-open:
    # a `paths` job that died without an output still runs the guard.
    if: ${{ !cancelled() && (github.event_name != 'merge_group' || needs.paths.outputs.touched != 'false') }}
    runs-on: ${{ github.event_name == 'merge_group' && vars.RUNNER_LABEL_MEDIUM_QUEUE || vars.RUNNER_LABEL_MEDIUM || 'ubuntu-latest-m' }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'

      # Caching the pnpm store rather than node_modules is what keeps the guard
      # honest: a restored node_modules can hold a virtual-store entry for a
      # version pnpm no longer resolves, and esbuild would bundle it happily.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every handler reaches @bike4mind/* through a dist/ entry point, so an
      # unbuilt core package is an unresolvable import rather than a missing
      # guard. A real deploy builds core first for the same reason.
      - name: Build core packages
        run: pnpm turbo:core:build

      - name: Bundle every Lambda handler
        run: node scripts/check-lambda-bundle.mjs

      - name: Run bundle guard tests
        run: pnpm exec vitest run --dir scripts/__tests__ --reporter=verbose check-lambda-bundle
