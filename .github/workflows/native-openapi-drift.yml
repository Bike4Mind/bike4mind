name: Native OpenAPI drift

# Advisory only: the job always finishes green. When the server spec and a native client snapshot
# disagree, one PR comment (found by its marker, edited in place) lists the per-client difference.
# The snapshots are compared after the clients' own overlay-literal stripping; see
# scripts/check_native_openapi_drift.py.
on:
  pull_request:
    paths:
      - 'apps/client/public/openapi.json'
      - 'apps/ios/Packages/B4MClient/openapi.json'
      - 'apps/android/client/openapi.json'
      - 'scripts/check_native_openapi_drift.py'
      - 'scripts/check-no-overlay-literals.sh'
      - '.github/workflows/native-openapi-drift.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: native-openapi-drift-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  drift:
    name: Compare native snapshots to the server spec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Compare snapshots
        id: compare
        run: |
          if python3 -I scripts/check_native_openapi_drift.py > "$RUNNER_TEMP/drift-report.md"; then
            cat "$RUNNER_TEMP/drift-report.md" >> "$GITHUB_STEP_SUMMARY"
            if grep -q '(drifted)' "$RUNNER_TEMP/drift-report.md"; then
              echo "drifted=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::warning::Native OpenAPI drift check could not run; see the log."
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      # A fork's token is read-only, so the comment is skipped there; the job summary still has the report.
      - name: Post or refresh the PR comment
        if: >-
          steps.compare.outputs.failed != 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          REPORT_PATH: ${{ runner.temp }}/drift-report.md
          DRIFTED: ${{ steps.compare.outputs.drifted }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- native-openapi-drift -->';
            const body = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else if (process.env.DRIFTED === 'true') {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
