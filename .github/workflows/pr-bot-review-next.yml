name: pr-bot-review-next

# Canary for the org's reusable PR-review workflow in Bike4Mind/workflow-templates.
# It runs beside `pr-bot-review.yml`, which stays the live bot until the cutover
# replaces it with a stub like this one. Separate labels and a separate
# concurrency group keep the two from sharing a run. They do not protect the
# live bot: it fires on every label, so a canary label cancels its in-flight run.
#
# `bot-review-next` reviews, `bot-review-fold-next` also folds. The reusable only
# auto-removes `bot-review` / `bot-review-fold`, so remove a canary label by hand
# before re-applying it.
on:
  pull_request:
    types: [labeled]

# Required, not decoration: a reusable job's GITHUB_TOKEN is capped by the
# caller's grant, and this repo's default token is read-only.
permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  id-token: write  # required by claude-code-action even when using anthropic_api_key

concurrency:
  # Workflow-level concurrency applies before the job `if:`, so every label joins
  # a group. Non-canary labels get a group of their own and cancel nothing.
  group: pr-bot-review-next-${{ github.event.pull_request.number }}-${{ (github.event.label.name == 'bot-review-next' || github.event.label.name == 'bot-review-fold-next') && 'canary' || github.run_id }}
  cancel-in-progress: ${{ github.event.label.name != 'bot-review-fold-next' }}

jobs:
  review:
    # The fork, draft and protected-ref gates live inside the reusable. Do NOT
    # switch this to pull_request_target: it would check out the untrusted head
    # and run an agent over it.
    if: github.event.label.name == 'bot-review-next' || github.event.label.name == 'bot-review-fold-next'
    # workflow-templates main, 2026-09-30
    uses: Bike4Mind/workflow-templates/.github/workflows/pr-bot-review.yml@468d672ad379ce13565a1f90cac0233bec6d21a7
    secrets: inherit
    with:
      fold_mode: ${{ github.event.label.name == 'bot-review-fold-next' }}
      # b4m-devtools main, 2026-09-30
      skill_ref: 9e7b019a41b55e429e654006808215fc65732507
      # Not APPROVE: under workflow_call the action's exchanged token cannot
      # approve ("without explicit repository access"), though it can comment.
      verdict_on_clean: COMMENT
      changeset_guard: true
      runner_label: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
