name: pr-bot-review

# Label-triggered PR review by the org's reusable workflow in
# Bike4Mind/workflow-templates (`.github/workflows/pr-bot-review.yml`). The review
# logic, its guards, the transcript redactor and their tests all live there.
#
# `bot-review` reviews. `bot-review-fold` also commits the findings that meet the
# fold bar as a fixup. The reusable removes either label after its run, so adding
# it again asks for a fresh pass.
#
# claude-code-action refuses to run when this file differs from the default
# branch's copy, so a PR that edits it cannot review itself; the reusable reports
# that on the PR.
on:
  pull_request:
    types: [labeled]

# Required, not decoration: a reusable job's GITHUB_TOKEN is capped by the
# caller's grant, and this repo's default token is read-only.
permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  id-token: write  # required by claude-code-action even when using anthropic_api_key

concurrency:
  # Workflow-level concurrency applies before the job `if:`, so every label joins
  # a group. Unrelated labels get a group of their own and cancel nothing. A fold
  # run never cancels an in-flight run; a later label still supersedes it.
  group: pr-bot-review-${{ github.event.pull_request.number }}-${{ (github.event.label.name == 'bot-review' || github.event.label.name == 'bot-review-fold') && 'bot' || github.run_id }}
  cancel-in-progress: ${{ github.event.label.name != 'bot-review-fold' }}

jobs:
  review:
    # The fork, draft and protected-ref gates live inside the reusable. Do NOT
    # switch this to pull_request_target: it would check out the untrusted head
    # and run an agent over it.
    if: github.event.label.name == 'bot-review' || github.event.label.name == 'bot-review-fold'
    # workflow-templates feat/pr-bot-review-federation; repin to main once merged
    uses: Bike4Mind/workflow-templates/.github/workflows/pr-bot-review.yml@8824df206cf67f09d34da39e1b3430fdff0247bc
    secrets: inherit
    with:
      fold_mode: ${{ github.event.label.name == 'bot-review-fold' }}
      # b4m-devtools main, 2026-09-30
      skill_ref: 9e7b019a41b55e429e654006808215fc65732507
      # Not APPROVE: GitHub has refused it from this token ("without explicit
      # repository access"). The reusable submits this verdict through a pending
      # review, the path on which REQUEST_CHANGES was refused too.
      verdict_on_clean: COMMENT
      changeset_guard: true
      runner_label: ${{ vars.RUNNER_LABEL || 'ubuntu-latest-m' }}
      # Workload identity federation. Unset the rule variable to fall back to the
      # ANTHROPIC_API_KEY secret; with it set, the key is not sent and a failed
      # exchange fails the review.
      anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
