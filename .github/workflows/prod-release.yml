name: Production Release

# Dispatched by the deployer right after it
# promotes a commit to production, passing that commit's SHA in `deployed_sha`.
# `target_branch` is a deprecated alias kept only while the deployer migrates.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (skip actual release creation)'
        required: false
        type: boolean
        default: true
      send_slack_notification:
        description: 'Send Slack notification for this run'
        required: false
        type: boolean
        default: false
      slack_webhook_url:
        description: 'Optional Slack webhook URL for release notifications'
        required: false
        type: string
      deployed_sha:
        description: 'Exact commit SHA that was deployed to production. Required for real (non-dry-run) runs.'
        required: false
        type: string
      target_branch:
        description: "DEPRECATED: use deployed_sha. Commit SHA that was deployed (defaults to HEAD for testing)"
        required: false
        type: string
        default: 'HEAD'

# Prevent concurrent releases
concurrency:
  group: prod-release
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  NODE_VERSION: '24'

jobs:
  create-release:
    name: Create Production Release
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest-m' }}
    env:
      NODE_OPTIONS: --max-old-space-size=14336
    permissions:
      contents: write # Required for creating releases
      id-token: write # Required for AWS OIDC authentication
      pull-requests: read # Required for fetching PR details in changelog generation

    steps:
      # Use b4m-release-bot App token (not GITHUB_TOKEN) to create the GitHub
      # Release. GITHUB_TOKEN / github-actions[bot] is not a bypass actor on the
      # release-tag-protection ruleset, so its tag creation is rejected (422
      # "creations being restricted"). The release App is a bypass actor.
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Verify App token is non-empty
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "::error::App token generation returned empty — check RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY."
            exit 1
          fi

      - name: Resolve deployed commit SHA
        id: resolve-sha
        env:
          DEPLOYED_SHA_INPUT: ${{ github.event.inputs.deployed_sha }}
          TARGET_BRANCH_INPUT: ${{ github.event.inputs.target_branch }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          DEPLOYED_SHA="${DEPLOYED_SHA_INPUT:-$TARGET_BRANCH_INPUT}"

          if [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            : # valid commit SHA
          elif [ "$DEPLOYED_SHA" = "HEAD" ] && [ "$DRY_RUN" = "true" ]; then
            : # HEAD is only allowed as a placeholder for dry-run testing
          else
            echo "::error::deployed_sha must be the exact 40-character commit SHA that was deployed (got '$DEPLOYED_SHA'). 'HEAD' is only accepted when dry_run is true."
            exit 1
          fi

          echo "deployed_sha=$DEPLOYED_SHA" | tee -a "$GITHUB_OUTPUT"

      - name: Determine configuration
        id: config
        env:
          AWS_DEV_ROLE_ARN: ${{ secrets.AWS_DEV_ROLE_ARN }}
          APP_NAME: ${{ vars.SEED_APP_NAME || 'bike4mind' }}
        run: |
          # The release only needs GitHub + Bedrock access, which the dev stage
          # provides; every deployer dispatch has always resolved to dev.
          echo "stage=dev" | tee -a "$GITHUB_OUTPUT"
          echo "aws_role_arn=$AWS_DEV_ROLE_ARN" | tee -a "$GITHUB_OUTPUT"

          echo "app_name=$APP_NAME" | tee -a "$GITHUB_OUTPUT"

      # Check out the dispatch ref, never the deployed SHA: the scripts must match
      # this workflow, and an older deployed commit's createProductionRelease.ts
      # ignores --target-sha. The commit range and tag target both go through the
      # GitHub API, so the deployed tree is never needed locally.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for proper commit comparison

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --recursive

      - name: Build bike4mind core packages
        run: pnpm core:build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.config.outputs.aws_role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}-prod-release

      - name: Create production release
        env:
          CI: 'true'
          SEED_APP_NAME: ${{ steps.config.outputs.app_name }}
          SEED_STAGE_NAME: ${{ steps.config.outputs.stage }}
          AWS_REGION: ${{ env.AWS_REGION }}
          # b4m-release-bot App token so the GitHub Release tag creation passes
          # the release-tag-protection ruleset (App is a bypass actor).
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SEND_SLACK_NOTIFICATION: ${{ github.event.inputs.send_slack_notification == 'true' }}
          # Allow manual override of the webhook; otherwise use the secret
          SLACK_WEBHOOK_URL: ${{ github.event.inputs.slack_webhook_url || secrets.CHANGELOG_SLACK_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          DEPLOYED_SHA: ${{ steps.resolve-sha.outputs.deployed_sha }}
          SST_STAGE: ${{ steps.config.outputs.stage }}
        run: |
          pnpm sst shell --stage "$SST_STAGE" --print-logs -- pnpm --filter @bike4mind/scripts create-prod-release --target-sha "$DEPLOYED_SHA"

      - name: Summary
        if: success()
        env:
          SST_STAGE: ${{ steps.config.outputs.stage }}
          DEPLOYED_SHA: ${{ steps.resolve-sha.outputs.deployed_sha }}
        run: |
          echo "Production release created successfully." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: workflow_dispatch" >> $GITHUB_STEP_SUMMARY
          echo "**Stage**: $SST_STAGE" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed SHA**: $DEPLOYED_SHA" >> $GITHUB_STEP_SUMMARY
