name: Render worker image

# Build the Studio render worker image (apps/workers/Dockerfile.renderworker) and publish it to GHCR, in the same
# shape as selfhost-image.yml: native per-arch runners, push by digest, and a merge job that writes the multi-arch
# tags. Kubernetes deploys pick it up by its immutable sha-<short> tag (selfhost/kubernetes renderWorker.image).
# On PRs the image is built but NOT pushed, so the gate needs no secrets and is fork-PR safe.

on:
  push:
    branches: [main]
    paths:
      - 'apps/workers/**'
      # The worker imports server code from here through the @server/* alias, and the image CMD loads the sst
      # alias shim from apps/client/server/chatCompletion.
      - 'apps/client/server/**'
      - 'b4m-core/**'
      - 'packages/**'
      - 'patches/**'
      # Every workspace manifest is copied into the install layer.
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'turbo.json'
      - '.dockerignore'
      - '.github/workflows/render-worker-image.yml'
      - '.github/actions/ghcr-base-image-mirror/**'
      - '!**/*.md'
      - '!**/*.mdx'
  pull_request:
    paths:
      - 'apps/workers/**'
      # The worker imports server code from here through the @server/* alias, and the image CMD loads the sst
      # alias shim from apps/client/server/chatCompletion.
      - 'apps/client/server/**'
      - 'b4m-core/**'
      - 'packages/**'
      - 'patches/**'
      # Every workspace manifest is copied into the install layer.
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'turbo.json'
      - '.dockerignore'
      - '.github/workflows/render-worker-image.yml'
      - '.github/actions/ghcr-base-image-mirror/**'
      - '!**/*.md'
      - '!**/*.mdx'
  workflow_dispatch:

concurrency:
  group: render-worker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

# Docker refs must be lowercase and github.repository_owner is not; each job derives env.IMAGE via its first step.

jobs:
  build:
    name: Build ${{ matrix.arch }}
    # Runner labels are variable-driven so runner policy changes (e.g. moving
    # amd64 to a larger paid pool) need no workflow edit. arm64 must stay on a
    # native arm runner or the build falls back to emulation speed.
    runs-on: ${{ matrix.arch == 'arm64' && (vars.RUNNER_LABEL_ARM || 'ubuntu-24.04-arm') || (vars.RUNNER_LABEL_HEAVY || 'ubuntu-latest-m') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # PR validation stays amd64-only (build-only, no secrets needed);
      # main/dispatch builds both architectures natively in parallel.
      matrix:
        include: ${{ github.event_name == 'pull_request' && fromJSON('[{"arch":"amd64","platform":"linux/amd64"}]') || fromJSON('[{"arch":"amd64","platform":"linux/amd64"},{"arch":"arm64","platform":"linux/arm64"}]') }}
    steps:
      - name: Derive lowercase image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/bike4mind-render-worker" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Every event logs in: the base images resolve through GHCR below. Publishing still happens only on
      # push/dispatch (same-repo); fork PRs get a read-only token and never reach the push path.
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve base images through GHCR
        id: base
        uses: ./.github/actions/ghcr-base-image-mirror
        with:
          dockerfile: apps/workers/Dockerfile.renderworker
          can-write: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Build (PR validation, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/workers/Dockerfile.renderworker
          platforms: ${{ matrix.platform }}
          push: false
          build-contexts: ${{ steps.base.outputs.build-contexts }}
          cache-from: type=gha,scope=render-worker-${{ matrix.arch }}

      - name: Build and push by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/workers/Dockerfile.renderworker
          platforms: ${{ matrix.platform }}
          # Push the untagged per-arch image by digest; the merge job below
          # stitches the digests into the tagged multi-arch manifest.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-contexts: ${{ steps.base.outputs.build-contexts }}
          cache-from: type=gha,scope=render-worker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=render-worker-${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          digest="$BUILD_DIGEST"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest-m' }}
    timeout-minutes: 10
    steps:
      - name: Derive lowercase image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/bike4mind-render-worker" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch tags
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046 # word splitting is the point: many -t and digest args
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(for digest in *; do printf '%s@sha256:%s ' "$IMAGE" "$digest"; done)

      - name: Inspect published image
        env:
          META_VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$META_VERSION"
