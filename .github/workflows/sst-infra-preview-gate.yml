name: SST / infra preview gate

# A PR that changes an sst pin or anything under infra/ must have a preview
# deploy behind it before it can merge. The one that bit us (an app-only sst
# bump with no matching overlay pins) was invisible until a real deploy ran,
# and it ran for the first time on staging. This gate reuses the deployer's
# `preview-deployed` label as the "a real hydrate+deploy has happened" signal.
#
# The trusted trigger has no path filter and decides applicability internally, so
# that as a required check it reports success on unrelated PRs instead of
# hanging pending. Label changes do not start a run here: a job-level filter on the
# label name is not an option (a skipped required check counts as passing), and
# every review-state swap would cost a run. sst-infra-preview-gate-relay.yml
# re-runs the head's latest run when `preview-deployed` or `skip-preview` moves.

# Label cleanup needs a write token on fork PRs. This workflow reads metadata only;
# never check out or execute the PR head here.
on:
  # Validate edits to this workflow before its trusted trigger is present on the base branch.
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/sst-infra-preview-gate.yml']
  pull_request_target:
    types: [opened, synchronize, reopened]

# A reopen right after a push, or a relay re-run beside a fresh push run, can put two
# runs on the same PR at once. Keyed per PR so they serialize, and on the PR
# specifically because a constant key would let one PR cancel another.
#
# NOT cancel-in-progress. Cancelling the twin saves the minutes but leaves a CANCELLED
# check run behind, and as a required check GitHub can read that as the current verdict
# - blocking a PR whose real verdict was a pass. Queueing costs one extra short run and
# both report the truth.
concurrency:
  group: preview-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  preview-gate:
    name: preview gate
    if: github.event_name == 'pull_request_target' || github.event_name == 'pull_request'
    # API-only required check; keep it off the pool that CI fan-out saturates.
    runs-on: ${{ vars.RUNNER_LABEL_LIGHT || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Expire preview waiver on push
        # A relay re-run replays the original payload. Only the first attempt may expire
        # the waiver, or re-running after a maintainer sets skip-preview would remove it.
        if: github.run_attempt == 1
        uses: actions/github-script@v8
        with:
          script: |
            if (context.payload.action !== 'synchronize') return;
            const pullRequest = context.payload.pull_request;
            if (!pullRequest.labels.some(label => label.name === 'skip-preview')) return;

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                name: 'skip-preview',
              });
              core.notice('Cleared skip-preview for new commits; a maintainer must reapply it for this head.');
            } catch (error) {
              if (error?.status !== 404) throw error;
            }

      - name: Require a preview for sst / infra changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          IS_SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail

          # Single fetch of changed files (with patches). No `|| true`: a fetch
          # failure must redden this gate (fail closed), never silently pass.
          gh api "repos/$REPO/pulls/$PR/files" --paginate > /tmp/pr_files_raw.json

          # The changesets "version packages" PR bumps versions + CHANGELOGs; its
          # b4m-core/infra/package.json bump trips the infra glob below with no real
          # infra change. Exempt those ARTIFACTS on a same-repo release PR rather
          # than trusting the branch name: `github.head_ref` is attacker-chosen on a
          # fork (this public repo takes external PRs), and the release branch is
          # long-lived and human-pushed -- so a real infra change riding it must
          # still redden. Filtering the diff instead of short-circuiting the whole
          # PR preserves that. Same-repo predicate mirrors auto-changeset.yml.
          if [ "$IS_SAME_REPO" = "true" ] && [ "$HEAD_REF" = "changeset-release/main" ]; then
            # Drop CHANGELOGs entirely (pure release artifacts, no deploy surface).
            # Keep b4m-core/infra/package.json in pr_files.json so the sst-pin patch
            # check below still inspects it; exclude it only from the path-glob input
            # (files.txt), so its version bump does not trip the glob while a
            # hand-pushed sst pin on that same file still reddens the gate.
            jq '[.[] | select((.filename == "CHANGELOG.md" or (.filename | endswith("/CHANGELOG.md"))) | not)]' /tmp/pr_files_raw.json > /tmp/pr_files.json
            jq -r '.[].filename' /tmp/pr_files.json > /tmp/files_all.txt
            grep -v '^b4m-core/infra/package\.json$' /tmp/files_all.txt > /tmp/files.txt || true
            echo "Release PR: excluded CHANGELOGs from detection; b4m-core/infra/package.json excluded from the path glob but still patch-inspected for sst pins."
          else
            cp /tmp/pr_files_raw.json /tmp/pr_files.json
            jq -r '.[].filename' /tmp/pr_files.json > /tmp/files.txt
          fi
          echo "Changed files considered:"; sed 's/^/  /' /tmp/files.txt || true

          # Tests under the gated paths have no deploy surface: sst.config.ts and the infra
          # modules never import them (only comments reference them), and they already run in
          # `Run Tests`. Left in the glob they make a test-only change demand a throwaway
          # preview deploy that cannot tell anyone anything, which is what happened to the WAF
          # shadow-rule test. Filtered out of the path-glob input ONLY, so the package.json
          # sst-pin patch inspection below still sees every file. Kept to test dirs and
          # *.test/*.spec files so all 51 real files under these paths still redden the gate.
          # An empty result is correct, not a failure: a tests-only PR is not applicable.
          # Markdown under these paths is notes (infra/*.md), never read by sst, and is
          # dropped for the same reason: it has no deploy surface to preview.
          grep -vE '(^|/)__tests__/|\.(test|spec)\.[cm]?[jt]sx?$|\.mdx?$' /tmp/files.txt > /tmp/files_glob.txt || true
          if ! cmp -s /tmp/files.txt /tmp/files_glob.txt; then
            echo "Excluded from the path glob as non-deploy-surface tests or markdown:"
            comm -23 <(sort /tmp/files.txt) <(sort /tmp/files_glob.txt) | sed 's/^/  /'
          fi

          applicable=0
          reason=""

          # Deploy-affecting paths that always need a preview: the root infra/
          # dir, the @bike4mind/infra package (b4m-core/infra/, imported directly
          # by the deploy layer), sst.config.ts, and apps/client/open-next.config.ts
          # (read only by the OpenNext build SST runs at deploy, so CI never exercises it).
          # Anchored so it does NOT match data-model dirs like
          # packages/database/src/models/infra/.
          if grep -qE '^(infra/|b4m-core/infra/|sst\.config\.ts$|apps/client/open-next\.config\.ts$)' /tmp/files_glob.txt; then
            applicable=1
            reason="infra/, b4m-core/infra/, sst.config.ts, or apps/client/open-next.config.ts changed"
          fi

          # A changed sst pin in any package.json. Fail closed if a package.json
          # changed but GitHub omitted its patch (oversized diff): treat as applicable.
          if [ "$applicable" -eq 0 ]; then
            if jq -e '.[] | select(.filename|test("package\\.json$")) | select((.patch // "") == "")' /tmp/pr_files.json >/dev/null; then
              applicable=1
              reason="a changed package.json had no inspectable patch (fail-closed)"
            elif jq -r '.[] | select(.filename|test("package\\.json$")) | .patch // ""' /tmp/pr_files.json | grep -qE '^[+-].*"sst"[[:space:]]*:'; then
              applicable=1
              reason="an sst pin in a package.json changed"
            fi
          fi

          if [ "$applicable" -eq 0 ]; then
            echo "No sst / infra changes in this PR. Gate not applicable -> pass."
            exit 0
          fi

          echo "This PR touches sst / infra ($reason); a preview deploy is required."

          # The deployer adds `preview-deployed` on a successful preview deploy.
          preview_labels=$(gh api "repos/$REPO/issues/$PR/labels" -q '.[].name')

          # Maintainers use skip-preview for non-deployment changes. A fresh waiver
          # is required after every push; labeled events re-evaluate the gate.
          if grep -qx 'skip-preview' <<< "$preview_labels"; then
            echo "::notice title=Preview skipped::'skip-preview' label is set. Gate satisfied without a preview deploy."
            exit 0
          fi

          if grep -qx 'preview-deployed' <<< "$preview_labels"; then
            echo "Found 'preview-deployed' label -> a preview has been deployed. Gate satisfied."
            exit 0
          fi

          # Previews are dispatched from the private deployer repo, so triggering one
          # needs write access there. Nothing on this repo starts one - see
          # CONTRIBUTING.md "Preview deploys".
          echo "::error title=Preview required::This PR changes SST configuration or deployable infrastructure and needs a successful preview. Ask a repository maintainer to deploy a preview, or apply the skip-preview label when no deployment verification is needed. The preview-deployed label satisfies this gate. If that label is removed, a fresh preview or waiver is required."
          exit 1
