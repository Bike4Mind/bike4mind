<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- MUI Joy's style engine injects <style> tags at runtime, hence 'unsafe-inline' for
         style-src only. The ws:/http: localhost entries are what Vite's HMR socket needs in
         dev; they are inert in a packaged build, which loads over file://. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:*"
    />
    <title>Bike4Mind</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
