appId: com.bike4mind.app
name: Launch shows the sign-in screen
tags:
  - smoke
---
# Needs no credentials and no server: proves the Debug build installs, launches and renders on this platform.
- launchApp:
    clearState: true
    stopApp: true
- runFlow: ../subflows/dismiss-anr.yaml
- runFlow: ../subflows/skip-onboarding.yaml
- extendedWaitUntil:
    visible:
      id: signin-submit-btn
    timeout: 30000
- assertVisible:
    id: signin-submit-btn
