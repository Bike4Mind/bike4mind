apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bike4mind-evaluation
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bike4mind/bike4mind.git
    targetRevision: REPLACE_WITH_IMMUTABLE_COMMIT_SHA
    path: selfhost/kubernetes
    helm:
      releaseName: bike4mind-evaluation
      valuesObject:
        existingSecret: bike4mind-runtime
        externalMongo:
          enabled: false
        storage:
          className: gp3-retain
        config:
          APP_URL: http://localhost:3000
          WEBSOCKET_URL: ws://localhost:3001
          CHAT_COMPLETION_PUBLIC_URL: http://localhost:8788
          S3_PRESIGN_ENDPOINT: http://localhost:19000
        images:
          app: REPLACE_WITH_MATCHING_IMAGE_DIGEST
          chatcompletion: REPLACE_WITH_MATCHING_IMAGE_DIGEST
          ws: REPLACE_WITH_MATCHING_IMAGE_DIGEST
          subscriberFanout: REPLACE_WITH_PINNED_IMAGE_DIGEST
          minio: REPLACE_WITH_MATCHING_IMAGE_DIGEST
          mc: REPLACE_WITH_MATCHING_IMAGE_DIGEST
  destination:
    server: https://kubernetes.default.svc
    namespace: bike4mind-evaluation
