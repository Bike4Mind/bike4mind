{{- if .Values.agentExecutor.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-agentexecutor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: agentexecutor}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: agentexecutor}
    spec:
      {{ include "b4m.pod" . | nindent 6 }}
      terminationGracePeriodSeconds: 840
      {{ include "b4m.wait" . | nindent 6 }}
      containers:
        - name: agentexecutor
          image: {{ required "images.agentexecutor is required" .Values.agentExecutor.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{ include "b4m.env" . | nindent 10 }}
            - {name: PORT, value: '8080'}
            - name: AGENT_EXECUTOR_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: AGENT_EXECUTOR_INTERNAL_SECRET
          resources: {{ .Values.resources.chatcompletion | toJson }}
          ports: [{name: http, containerPort: 8080}]
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-agentexecutor
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: agentexecutor}
  ports: [{name: http, port: 8080, targetPort: http}]

{{- end }}
